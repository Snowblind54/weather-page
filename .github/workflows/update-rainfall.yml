name: Update official rainfall observations
on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_rainfall.py
      - tests/test_rainfall.py
      - .github/workflows/update-rainfall.yml
permissions:
  contents: write
concurrency:
  group: update-official-rainfall
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check rainfall adapters
        run: python3 -m unittest discover -s tests -p test_rainfall.py -v
      - name: Fetch official hourly precipitation and retain histories
        run: python3 scripts/update_rainfall.py
      - name: Save official precipitation snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official-rainfall.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official rainfall observations'
          git pull --rebase origin main
          git push origin HEAD:main
