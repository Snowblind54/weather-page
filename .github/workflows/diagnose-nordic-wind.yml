name: Diagnose Nordic wind
on:
  push:
    branches: [diagnose/nordic-wind]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Norwegian gust elements
        run: |
          python3 - <<'PY'
          import datetime as dt, json, urllib.parse, urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NorthernWeather diagnostics (github.com/Snowblind54/weather-page)'})
              with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
          now=dt.datetime.now(dt.timezone.utc)
          base='https://rim.k8s.met.no/api/v1/'
          start=(now-dt.timedelta(days=1)).date().isoformat(); end=(now+dt.timedelta(days=1)).date().isoformat()
          candidates=['wind_speed_of_gust','max(wind_speed_of_gust PT1H)','max(wind_speed_of_gust PT10M)','max(wind_speed_of_gust PT1M)','max(wind_speed PT1H)','wind_gust']
          found=[]
          for element in candidates:
              for resolution in ('hours','minutes',''):
                  p=dict(sourceName='',weatherElements=element,**{'from':start,'to':end},includeRegions='false')
                  if resolution:p['timeResolution']=resolution
                  try:data=(get(base+'stations?'+urllib.parse.urlencode(p)).get('data') or [])
                  except Exception as e:
                      print('META ERROR',element,resolution or 'omit',repr(e));continue
                  official=[s for s in data if 'MET.NO' in s.get('stationHolders',[]) and len(s.get('geometry',{}).get('coordinates') or [])>=2]
                  print('META',element,resolution or 'omit',len(official))
                  if official and not found:found=(element,resolution,official[:20])
          if found:
              element,resolution,stations=found
              for requested in [element,'wind_speed_of_gust','max(wind_speed_of_gust PT1H)','max(wind_speed PT1H)']:
                  for timeres in filter(None,[resolution,'hours','minutes']):
                      q=dict(sources=','.join(s['id'] for s in stations),referenceTime=start+'/'+end,elements=requested,timeResolution=timeres)
                      try:data=get(base+'observations?'+urllib.parse.urlencode(q))
                      except Exception as e:
                          print('OBS ERROR',requested,timeres,repr(e));continue
                      obs=[]
                      for row in data.get('data') or []:
                          for o in row.get('observations') or []:
                              obs.append((row.get('sourceId'),row.get('referenceTime'),o.get('elementId'),o.get('value'),o.get('unit'),o.get('qualityCode'),o.get('timeSeriesId'),o.get('timeResolution'),o.get('timeOffset')))
                      print('OBS',requested,timeres,'count',len(obs),'samples',obs[:8])
          PY
