name: Diagnose Nordic wind
on:
  push:
    branches: [diagnose/nordic-wind]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Iceland observation timing
        run: |
          python3 - <<'PY'
          import datetime as dt, json, urllib.request, sys
          sys.path.insert(0,'scripts')
          import update_official_wind as w
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NorthernWeather diagnostics (github.com/Snowblind54/weather-page)'})
              with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
          now=dt.datetime.now(dt.timezone.utc); now_s=int(now.timestamp())
          meta=get('https://api.vedur.is/weather/stations?active=true&station_type=sj')
          urls={
            'hour_latest':'https://api.vedur.is/weather/observations/aws/hour/latest?parameters=basic',
            '10min_latest':'https://api.vedur.is/weather/observations/aws/10min/latest?parameters=basic',
            '10min_two':'https://api.vedur.is/weather/observations/aws/10min?parameters=basic&order=desc&count=2',
          }
          for label,url in urls.items():
              raw=get(url)
              deltas=[]
              for r in raw:
                  if not r.get('time'):continue
                  t=w.timestamp(r['time']);deltas.append(t-now_s)
              parsed=w.parse_iceland(raw,meta)
              merged=w.merge([],parsed,now)
              uniq=len({s['code'] for s in parsed})
              reyk=[s for s in merged if s['code']=='1475']
              print(label,'raw',len(raw),'parsed',len(parsed),'unique',uniq,'merged',len(merged),'reyk',reyk[:1])
              print(label,'delta_seconds min/max',min(deltas),max(deltas),'future>60',sum(d>60 for d in deltas),'future>600',sum(d>600 for d in deltas),'<=now+60',sum(d<=60 for d in deltas))
              print(label,'sample times',[(r.get('station'),r.get('time')) for r in raw[:12]])
          PY
