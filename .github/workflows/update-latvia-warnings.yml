name: Update official Latvia, Poland and Denmark warnings

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_latvia_warnings.py
      - scripts/update_national_warnings.py
      - tests/test_national_warnings.py
      - .github/workflows/update-latvia-warnings.yml

permissions:
  contents: write

concurrency:
  group: update-latvia-warnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check national warning parsers
        run: python3 -m unittest discover -s tests -p 'test_national_warnings.py' -v
      - name: Fetch official LVGMC warnings and polygons
        run: python3 scripts/update_latvia_warnings.py
      - name: Fetch official IMGW and DMI warnings and polygons
        if: ${{ !cancelled() }}
        run: python3 scripts/update_national_warnings.py
      - name: Save updated warning snapshots
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latvia-warnings.json data/national-warnings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official Latvia, Poland and Denmark warnings'
          git pull --rebase origin main
          git push origin HEAD:main
