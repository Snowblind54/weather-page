name: Update official national weather warnings

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/run_warning_updates.py
      - tests/test_run_warning_updates.py
      - scripts/sync_r2_data.py
      - tests/test_warning_snapshot_generation.py
      - scripts/update_latvia_warnings.py
      - scripts/update_national_warnings.py
      - scripts/update_europe_warnings.py
      - scripts/update_turkey_warnings.py
      - scripts/update_portugal_warnings.py
      - scripts/build_portugal_warning_regions.py
      - data/portugal-warning-regions.json.gz
      - tests/test_portugal_warnings.py
      - scripts/build_southern_warning_regions.py
      - data/southern-warning-regions.json.gz
      - tests/test_turkey_warnings.py
      - tests/fixtures/spain-official-warning.xml
      - tests/fixtures/italy-official-warning.xml
      - tests/fixtures/greece-official-warning.xml
      - tests/fixtures/turkey-official-warnings.json
      - js/national-warnings.js
      - js/warnings.js
      - js/warning-filters.js
      - js/warning-refresh.js
      - tests/warning-*.test.cjs
      - scripts/build_central_warning_regions.py
      - data/central-warning-regions.json.gz
      - tests/fixtures/slovakia-official-warning.xml
      - scripts/build_western_warning_regions.py
      - data/western-warning-regions.json.gz
      - data/ireland-warning-counties.json.gz
      - tests/test_europe_warnings.py
      - tests/warning-freshness.test.cjs
      - scripts/update_us_warnings.py
      - tests/test_us_warnings.py
      - scripts/publish_generated_data.sh
      - tests/test_national_warnings.py
      - .github/workflows/update-latvia-warnings.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: update-latvia-warnings
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ vars.WARNING_UPDATES_PAUSED != 'true' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/latvia-warnings.json
            data/national-warnings.json
            data/nws-warning-zones.json
          key: r2-input-update-latvia-warnings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-update-latvia-warnings-
      - name: Restore verified last successful R2 data
        continue-on-error: true
        run: python3 scripts/hydrate_r2_data.py data/latvia-warnings.json data/national-warnings.json
      - name: Check national warning parsers
        run: python3 -m unittest discover -s tests -p 'test_*warnings.py' -v
      - name: Check repeated collection, isolated failures and snapshot ordering
        run: |
          python3 -m unittest discover -s tests -p test_run_warning_updates.py -v
          python3 -m unittest discover -s tests -p test_warning_snapshot_generation.py -v
      - name: Check warning map rendering, filtering and large warning volumes
        run: node --test tests/warning-*.test.cjs tests/us-warnings.test.cjs
      - name: Collect and publish warnings every ten minutes
        run: |
          # Verify a full handover immediately after a code change.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 -u scripts/run_warning_updates.py --cycles 1
          else
            python3 -u scripts/run_warning_updates.py --cycles 30
          fi
      - name: Queue the next collector without waiting for cron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run update-latvia-warnings.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
