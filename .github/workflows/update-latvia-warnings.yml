name: Update official Latvia, Poland, Denmark, Greenland and Canada warnings

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_latvia_warnings.py
      - scripts/update_national_warnings.py
      - scripts/publish_generated_data.sh
      - tests/test_national_warnings.py
      - .github/workflows/update-latvia-warnings.yml

permissions:
  contents: write

concurrency:
  group: update-latvia-warnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check national warning parsers
        run: python3 -m unittest discover -s tests -p 'test_national_warnings.py' -v
      - name: Fetch official LVGMC warnings and polygons
        run: python3 scripts/update_latvia_warnings.py
      - name: Fetch official IMGW, DMI and ECCC warnings and polygons
        if: ${{ !cancelled() }}
        run: python3 scripts/update_national_warnings.py
      - name: Save updated warning snapshots
        if: ${{ !cancelled() }}
        run: bash scripts/publish_generated_data.sh 'Refresh official Latvia, Poland, Denmark, Greenland and Canada warnings' data/latvia-warnings.json data/national-warnings.json
