name: Temporary temperature station upgrade

on:
  push:
    branches:
      - feat/norway-temperature-popups

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/norway-temperature-popups
          fetch-depth: 0
      - name: Apply temperature station patch
        run: python3 scripts/tmp_temperature_station_upgrade.py
      - name: Validate JavaScript syntax
        run: node --check js/stations.js
      - name: Verify Norway official station feed live
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, datetime as dt
          now=dt.datetime.now(dt.timezone.utc)
          start=(now-dt.timedelta(days=2)).date().isoformat()
          end=(now+dt.timedelta(days=1)).date().isoformat()
          base='https://rim.k8s.met.no/api/v1/'
          q=urllib.parse.urlencode(dict(sourceName='',weatherElements='air_temperature',timeResolution='hours',**{'from':start,'to':end},includeRegions='false'))
          req=urllib.request.Request(base+'stations?'+q,headers={'User-Agent':'Snowblind weather map validation'})
          with urllib.request.urlopen(req,timeout=30) as r: stations=json.load(r).get('data') or []
          official=[s for s in stations if 'MET.NO' in (s.get('stationHolders') or []) and len((s.get('geometry') or {}).get('coordinates') or [])>=2]
          assert official, 'No MET Norway official temperature stations found'
          batch=official[:40]
          q=urllib.parse.urlencode(dict(sources=','.join(s['id'] for s in batch),referenceTime=start+'/'+end,elements='air_temperature',timeResolution='hours'))
          req=urllib.request.Request(base+'observations?'+q,headers={'User-Agent':'Snowblind weather map validation'})
          with urllib.request.urlopen(req,timeout=30) as r: rows=json.load(r).get('data') or []
          count=0
          for row in rows:
            for obs in row.get('observations') or []:
              if obs.get('elementId')=='air_temperature' and obs.get('timeSeriesId')==0 and obs.get('qualityCode') in (0,2,4) and isinstance(obs.get('value'),(int,float)):
                count+=1
          assert count, 'No current MET Norway air_temperature observations found'
          print(f'Validated {len(official)} MET.NO station metadata rows and {count} temperature observations in first batch')
          PY
      - name: Verify implementation markers
        run: |
          grep -q "loadNorwayOfficialTemperature" js/stations.js
          grep -q "interactive:true" js/stations.js
          grep -q "officialTemperaturePopup" js/stations.js
          grep -q "Northern Weather Map v8.67" index.html
          grep -q "js/stations.js?v=8.67" index.html
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/stations.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Norway temperature stations and clickable popups"
            git push origin HEAD:feat/norway-temperature-popups
          fi
