name: Temporary Estonia radar overlap fix
on:
  push:
    branches: [fix/norway-temperature-rate-limit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/estonia-radar-overlap
      - name: Apply patch
        run: python3 scripts/tmp_patch_estonia_radar.py
      - name: Validate
        run: |
          node --test tests/radar-direct.test.cjs tests/nordic-radar.test.cjs
          git diff --check
      - name: Commit production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/radar-images.js js/map.js js/radar.js tests/radar-direct.test.cjs index.html
          git commit -m 'Prevent duplicate radar echoes over Estonia'
          git push origin HEAD:fix/estonia-radar-overlap
