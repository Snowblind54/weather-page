name: Temporary Estonia radar overlap fix
on:
  push:
    branches:
      - fix/estonia-radar-overlap
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/estonia-radar-overlap
      - name: Apply Estonia radar patch
        run: |
          python3 scripts/tmp_patch_estonia_radar.py
      - name: Validate radar tests
        run: |
          node --test tests/radar-direct.test.cjs tests/nordic-radar.test.cjs
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/radar-images.js js/map.js js/radar.js tests/radar-direct.test.cjs index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prevent duplicate radar echoes over Estonia'
          git push origin HEAD:fix/estonia-radar-overlap
