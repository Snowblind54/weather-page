name: Temporary MET Norway minute probe
on:
  push:
    branches: [feature/fresher-official-wind]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe MET Norway minute wind
        run: |
          python3 - <<'PY'
          import datetime as dt, json, urllib.parse, urllib.request
          def getj(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NorthernWeather-probe/1.0'})
              with urllib.request.urlopen(req,timeout=40) as r: return json.load(r)
          now=dt.datetime.now(dt.timezone.utc); base='https://rim.k8s.met.no/api/v1/'
          start=(now-dt.timedelta(days=1)).date().isoformat(); end=(now+dt.timedelta(days=1)).date().isoformat()
          for elements in ['wind_speed','wind_speed_of_gust','wind_speed,max(wind_speed_of_gust PT1H)','wind_speed,wind_speed_of_gust']:
              p=dict(sourceName='',weatherElements=elements,timeResolution='minutes',**{'from':start,'to':end},includeRegions='false')
              try:
                  arr=getj(base+'stations?'+urllib.parse.urlencode(p)).get('data') or []
                  off=[x for x in arr if 'MET.NO' in x.get('stationHolders',[])]
                  print('stations',elements,len(arr),'MET.NO',len(off),'sample',off[0]['id'] if off else None)
                  if not off: continue
                  sid=off[0]['id']; ref=(now-dt.timedelta(hours=2)).isoformat()+'/'+now.isoformat()
                  q=dict(sources=sid,referenceTime=ref,elements=elements+',wind_from_direction',timeResolution='minutes')
                  rows=getj(base+'observations?'+urllib.parse.urlencode(q)).get('data') or []
                  print('obs',elements,'rows',len(rows),'times',[r.get('referenceTime') for r in rows[-12:]],'elements',sorted({o.get('elementId') for r in rows for o in r.get('observations',[])}))
              except Exception as e: print('ERR',elements,repr(e))
          PY
