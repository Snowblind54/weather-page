name: Temporary radar pink
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary radar pink workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend radar palette into bright pink
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/radar-grid.mjs')
          s=p.read_text()
          old='[150,0,190,210],[90,0,145,210]]'
          new='[150,0,190,210],[255,79,195,220]]'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('js/nordic-radar-worker.js')
          s=p.read_text()
          assert "./radar-grid.mjs?v=8.34" in s
          p.write_text(s.replace("./radar-grid.mjs?v=8.34","./radar-grid.mjs?v=8.79",1))

          p=Path('js/nordic-radar.js')
          s=p.read_text()
          assert "js/nordic-radar-worker.js?v=8.44" in s
          p.write_text(s.replace("js/nordic-radar-worker.js?v=8.44","js/nordic-radar-worker.js?v=8.79",1))

          p=Path('index.html')
          s=p.read_text()
          assert '<title>Northern Weather Map v8.78</title>' in s
          s=s.replace('<title>Northern Weather Map v8.78</title>','<title>Northern Weather Map v8.79</title>',1)
          old='<div class="legend" aria-label="Radar rain-rate colour scale in millimetres per hour"></div>'
          new='<div class="legend" aria-label="Radar rain-rate colour scale in millimetres per hour" style="background:linear-gradient(90deg,transparent 0%,#9cddff 8%,#36aaff 18%,#00d89a 30%,#e8f700 44%,#ffc400 56%,#ff7b00 67%,#ff2a2a 78%,#d300d7 88%,#9600be 94%,#ff4fc3 100%)"></div>'
          assert old in s
          s=s.replace(old,new,1)
          assert 'js/nordic-radar.js?v=8.49' in s
          s=s.replace('js/nordic-radar.js?v=8.49','js/nordic-radar.js?v=8.79',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --input-type=module - <<'NODE'
          import {radarColour} from './js/radar-grid.mjs';
          const c=radarColour(60);
          if(c[0]!==255 || c[1]!==79 || c[2]!==195) throw new Error('50+ mm/h is not bright pink');
          NODE
          grep -q '#ff4fc3 100%' index.html
          grep -q 'nordic-radar.js?v=8.79' index.html
      - name: Commit production change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-radar-pink.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/radar-grid.mjs js/nordic-radar-worker.js js/nordic-radar.js .github/workflows/tmp-radar-pink.yml
          git commit -m 'Extend radar scale into bright pink'
          git push
