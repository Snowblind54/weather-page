name: Update daily snow history
on:
  schedule:
    - cron: '17 6,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_snow_history.py
      - scripts/requirements-snow-history.txt
      - scripts/publish_generated_data.sh
      - tests/test_snow_history.py
      - .github/workflows/update-snow-history.yml
permissions:
  contents: write
concurrency:
  group: update-daily-snow-history
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-snow-history.txt
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/snow-history.json
            data/snow-history/
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/snow-history.json data/snow-history/
      - run: pip install -r scripts/requirements-snow-history.txt
      - name: Test archive conversion
        run: python -m unittest discover -s tests -p test_snow_history.py -v
      - name: Cache official daily analyses
        run: python scripts/update_snow_history.py
      - name: Publish rolling archive
        run: bash scripts/publish_generated_data.sh 'Refresh 14-day official IMS snow archive' data/snow-history.json data/snow-history/
