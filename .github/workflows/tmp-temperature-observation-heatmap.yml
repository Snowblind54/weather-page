name: Temporary temperature observation heatmap

on:
  push:
    branches:
      - feat/temperature-observation-heatmap

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/temperature-observation-heatmap
          fetch-depth: 0
      - name: Apply temperature heatmap patch
        run: python3 scripts/tmp_temperature_obs_heatmap.py
      - name: Validate JavaScript syntax
        run: |
          node --check js/temperature.js
          node --check js/stations.js
      - name: Verify observation-aware heatmap markers
        run: |
          grep -q "TEMP_OBS_RADIUS_KM=70" js/temperature.js
          grep -q "temperatureAdjustedValue" js/temperature.js
          grep -q "invalidateTemperatureHeatmapCache" js/temperature.js
          grep -q "temperatureEnabled()?loadOfficialTemperatureStations" js/stations.js
          grep -q "coastlineClipped=clipTemperatureToCountries" js/temperature.js
          grep -q "Northern Weather Map v8.68" index.html
          grep -q "js/temperature.js?v=8.68" index.html
          grep -q "js/stations.js?v=8.68" index.html
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/temperature.js js/stations.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Blend official observations into temperature heatmap"
            git push origin HEAD:feat/temperature-observation-heatmap
          fi
