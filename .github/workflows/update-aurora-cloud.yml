name: Update ECMWF aurora cloud field

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_aurora_cloud.py
      - scripts/publish_generated_data.sh
      - .github/workflows/update-aurora-cloud.yml

permissions:
  contents: read

concurrency:
  group: shared-aurora-cloud
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/aurora-cloud.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/aurora-cloud.json
      - name: Install ECMWF GRIB tools
        run: python3 -m pip install --disable-pip-version-check ecmwf-opendata eccodes
      - name: Fetch ECMWF IFS total cloud cover
        run: python3 scripts/update_aurora_cloud.py
      - name: Publish ECMWF aurora cloud field
        run: bash scripts/publish_generated_data.sh 'Refresh ECMWF aurora cloud field' data/aurora-cloud.json
