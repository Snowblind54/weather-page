name: Update North Atlantic and Europe cyclones
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_cyclones.py
      - scripts/update_fronts.py
      - scripts/cyclone_names.py
      - scripts/requirements-cyclones.txt
      - scripts/update_cyclone_ensemble.py
      - scripts/publish_generated_data.sh
      - tests/test_cyclone_ensemble.py
      - tests/test_cyclones.py
      - tests/test_cyclone_fronts.py
      - .github/workflows/update-cyclones.yml
permissions:
  contents: read
concurrency:
  group: update-cyclones
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-cyclones.txt
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/cyclones.json
            data/fronts.json
            data/cyclone-ensemble.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/cyclones.json data/fronts.json data/cyclone-ensemble.json
      - name: Install GRIB decoder and tracking dependencies
        run: python -m pip install -r scripts/requirements-cyclones.txt
      - name: Check cyclone detection and association
        run: python -m unittest discover -s tests -p 'test_cyclone*.py' -v
      - name: Fetch GFS fields, detect centres and project tracks
        run: python scripts/update_cyclones.py
      - name: Derive cold and warm fronts from the same GFS cycle
        continue-on-error: true
        run: python scripts/update_fronts.py
      - name: Match GEFS ensemble tracks and estimate descriptive spread
        continue-on-error: true
        run: python scripts/update_cyclone_ensemble.py
      - name: Save cyclone snapshot
        if: ${{ !cancelled() }}
        run: bash scripts/publish_generated_data.sh 'Refresh North Atlantic and Europe cyclone tracks' data/cyclones.json data/fronts.json data/cyclone-ensemble.json
