name: Deploy Meteosat low cloud recovery
on: [push]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cloud caches
        run: python3 -c "from pathlib import Path; p=Path('js/clouds.js'); t=p.read_text(encoding='utf-8'); assert \"js/cloud-worker.js?v=8.21\" in t; p.write_text(t.replace('js/cloud-worker.js?v=8.21','js/cloud-worker.js?v=8.22',1),encoding='utf-8'); p=Path('js/config.js'); t=p.read_text(encoding='utf-8'); assert 'js/cloud-eumet-cleanup.js?v=1' in t; p.write_text(t.replace('js/cloud-eumet-cleanup.js?v=1','js/cloud-eumet-cleanup.js?v=3',1),encoding='utf-8'); p=Path('index.html'); t=p.read_text(encoding='utf-8'); assert 'js/config.js?v=8.87' in t and 'js/clouds.js?v=8.32' in t; t=t.replace('js/config.js?v=8.87','js/config.js?v=8.88',1).replace('js/clouds.js?v=8.32','js/clouds.js?v=8.33',1); p.write_text(t,encoding='utf-8')"
      - name: Validate
        run: |
          node --check js/cloud-eumet-cleanup.js
          node --check js/cloud-worker.js
          node --check js/clouds.js
          node --check js/config.js
          grep -q 'cloud-eumet-cleanup.js?v=3' js/cloud-worker.js
          grep -q 'cloud-eumet-cleanup.js?v=3' js/config.js
          grep -q 'cloud-worker.js?v=8.22' js/clouds.js
          grep -q 'js/config.js?v=8.88' index.html
          grep -q 'js/clouds.js?v=8.33' index.html
      - name: Publish
        run: bash scripts/publish_generated_data.sh 'Improve Meteosat warm low-cloud visibility' js/cloud-eumet-cleanup.js js/cloud-worker.js js/clouds.js js/config.js index.html
