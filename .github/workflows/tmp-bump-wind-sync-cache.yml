name: Temporary wind sync cache bump

on:
  push:
    branches:
      - fix/wind-mode-sync-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply wind sync cache bump'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wind-mode-sync-cache
          fetch-depth: 0
      - name: Patch index cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Northern Weather Map v8.71','Northern Weather Map v8.72')
          s=s.replace('js/official-wind.js?v=8.65','js/official-wind.js?v=8.72')
          p.write_text(s)
          PY
          git diff --check
          grep -F 'Northern Weather Map v8.72' index.html
          grep -F 'js/official-wind.js?v=8.72' index.html
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Apply wind sync cache bump'
          git push origin HEAD:fix/wind-mode-sync-cache
