name: Inspect central European temperature feeds
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-central-temperature.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public official feed schemas
        run: |
          python3 - <<'PY'
          import json, urllib.request, re, concurrent.futures
          urls=['https://opendata.chmi.cz/meteorology/climate/now/metadata/meta4-20261019.json','https://opendata.chmi.cz/meteorology/climate/now/metadata/meta2-20261019.json','https://metapi.ana.lu/api/v1/hvd/observations','https://www.shmu.sk/dist/assets/meteo/main_akt_map_sk-BEk13x-B.js','http://opendata.shmu.sk/meteorology/climate/now/data/20261019/','http://opendata.shmu.sk/meteorology/climate/','https://www.shmu.sk/sk/?page=1&id=meteo_apocasie_sk']
          def get(url):
           try:
            with urllib.request.urlopen(url,timeout=30) as r:raw=r.read(6000000).decode('utf-8-sig')
            if 'meta2' in url:
             d=json.loads(raw)['data']['data'];v=[x for x in d['values'] if x[2]=='T'];s={'header':d['header'],'count':len(v),'values':v[:4]}
            elif 'ana.lu' in url or 'meta4' in url:s=json.loads(raw)
            elif url.endswith('.js'):s={'length':len(raw),'snippets':[raw[max(0,m.start()-180):m.end()+400] for m in re.finditer(r'(?i)\.json|fetch\\(|axios|https:|station|geogr|\.php',raw)][-40:]}
            elif 'meteo_apocasie_sk' in url:
             s=[raw[max(0,m.start()-150):m.end()+200] for m in list(re.finditer(r'(?i)aktualiz|LSE|SEC|SEČ|datetime|h_stanica',raw))[:10]]
            else:s=raw[:9000]
            return {'url':url,'sample':s}
           except Exception as e:return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
           for x in pool.map(get,urls):print(json.dumps(x,ensure_ascii=False),flush=True)
          
          PY
