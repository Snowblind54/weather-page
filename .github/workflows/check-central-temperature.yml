name: Inspect central European temperature feeds
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-central-temperature.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public official feed schemas
        run: |
          python3 - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://www.shmu.sk/api/v1/meteo/getweathergeojson',timeout=30) as response:data=json.load(response)
          print(json.dumps({'keys':list(data),'count':len(data.get('features',[])),'sample':data.get('features',[])[:3]},ensure_ascii=False),flush=True)
          
          PY
