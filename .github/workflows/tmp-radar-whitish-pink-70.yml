name: Temporary radar whitish pink 70
on:
  push:
    branches: [feature/radar-whitish-pink-70]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary radar palette patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend radar palette to 70 mm per hour
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/radar-grid.mjs')
          s=p.read_text()
          old="const radarColourStops=[.1,.3,.5,1,2,4,8,16,50,Infinity];\nconst radarColours=[[156,221,255,210],[54,170,255,210],[0,216,154,210],[232,247,0,210],[255,196,0,210],[255,123,0,210],[255,42,42,210],[211,0,215,210],[150,0,190,210],[255,79,195,220]],radarTransparent=[0,0,0,0];"
          new="const radarColourStops=[.1,.3,.5,1,2,4,8,16,50,70,Infinity];\nconst radarColours=[[156,221,255,210],[54,170,255,210],[0,216,154,210],[232,247,0,210],[255,196,0,210],[255,123,0,210],[255,42,42,210],[211,0,215,210],[150,0,190,210],[255,126,218,225],[255,235,247,235]],radarTransparent=[0,0,0,0];"
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('js/nordic-radar-worker.js')
          s=p.read_text()
          assert "./radar-grid.mjs?v=8.79" in s
          p.write_text(s.replace("./radar-grid.mjs?v=8.79","./radar-grid.mjs?v=8.80",1))

          p=Path('js/nordic-radar.js')
          s=p.read_text()
          assert "js/nordic-radar-worker.js?v=8.79" in s
          p.write_text(s.replace("js/nordic-radar-worker.js?v=8.79","js/nordic-radar-worker.js?v=8.80",1))

          p=Path('index.html')
          s=p.read_text()
          assert '<title>Northern Weather Map v8.79</title>' in s
          s=s.replace('<title>Northern Weather Map v8.79</title>','<title>Northern Weather Map v8.80</title>',1)
          old='style="background:linear-gradient(90deg,transparent 0%,#9cddff 8%,#36aaff 18%,#00d89a 30%,#e8f700 44%,#ffc400 56%,#ff7b00 67%,#ff2a2a 78%,#d300d7 88%,#9600be 94%,#ff4fc3 100%)"'
          new='style="background:linear-gradient(90deg,transparent 0%,#9cddff 8%,#36aaff 18%,#00d89a 30%,#e8f700 44%,#ffc400 56%,#ff7b00 67%,#ff2a2a 77%,#d300d7 86%,#9600be 92%,#ff7eda 97%,#ffebf7 100%)"'
          assert old in s
          s=s.replace(old,new,1)
          old_values='<div class="rain-legend-values"><span>0.1</span><span>0.3</span><span>0.5</span><span>1</span><span>2</span><span>4</span><span>8</span><span>16</span><span>50+ mm/h</span></div>'
          new_values='<div class="rain-legend-values"><span>0.1</span><span>0.3</span><span>0.5</span><span>1</span><span>2</span><span>4</span><span>8</span><span>16</span><span>50</span><span>70+ mm/h</span></div>'
          assert old_values in s
          s=s.replace(old_values,new_values,1)
          assert 'js/nordic-radar.js?v=8.79' in s
          s=s.replace('js/nordic-radar.js?v=8.79','js/nordic-radar.js?v=8.80',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --input-type=module - <<'NODE'
          import {radarColour} from './js/radar-grid.mjs';
          const pink=radarColour(55), whitePink=radarColour(75);
          if(pink[0]!==255 || pink[1]!==126 || pink[2]!==218) throw new Error('50-70 mm/h is not bright pink');
          if(whitePink[0]!==255 || whitePink[1]!==235 || whitePink[2]!==247) throw new Error('70+ mm/h is not whitish pink');
          NODE
          node --check js/nordic-radar.js
          node --check js/nordic-radar-worker.js
          grep -q '#ffebf7 100%' index.html
          grep -q '<span>70+ mm/h</span>' index.html
          grep -q 'nordic-radar.js?v=8.80' index.html
      - name: Commit production change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-radar-whitish-pink-70.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/radar-grid.mjs js/nordic-radar-worker.js js/nordic-radar.js .github/workflows/tmp-radar-whitish-pink-70.yml
          git commit -m 'Extend radar palette to whitish pink at 70 mm-h'
          git push
