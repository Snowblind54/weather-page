name: Optimize desktop wind animation
on:
  push:
    branches: [fix/wind-desktop-performance]
    paths:
      - .github/workflows/optimize-wind-desktop.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Optimize large-canvas wind rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/wind.js')
          s=p.read_text()
          old="""    const dpr=Math.min(window.devicePixelRatio||1,1.25);\n    const pixelWidth=Math.round(size.x*dpr),pixelHeight=Math.round(size.y*dpr);"""
          new="""    // Large desktop canvases cost far more to fade and redraw than phone canvases.\n    // Render the animation at CSS-pixel resolution once the viewport is large;\n    // smaller screens can keep a modest DPR boost without a meaningful cost.\n    const area=size.x*size.y;\n    const dpr=area>=900000?1:Math.min(window.devicePixelRatio||1,1.25);\n    const pixelWidth=Math.round(size.x*dpr),pixelHeight=Math.round(size.y*dpr);"""
          if old not in s: raise SystemExit('DPR block not found')
          s=s.replace(old,new,1)
          old2="""    const density=Number($('windDensity').value)/100;\n    const count=Math.min(1600,Math.round(seeds.length*this.step*this.step/900*density));"""
          new2="""    const density=Number($('windDensity').value)/100;\n    // Particle cost also scales with viewport area. Phones keep the previous\n    // density, while large desktop views use a tighter ceiling so 1080p/1440p\n    // screens can hold 30 fps instead of spending the frame budget on >1600 trails.\n    const particleTarget=Math.round(seeds.length*this.step*this.step/900*density);\n    const particleCap=area>=900000?Math.min(1050,Math.round(area/1700)):1200;\n    const count=Math.max(80,Math.min(particleCap,particleTarget));"""
          if old2 not in s: raise SystemExit('particle block not found')
          p.write_text(s.replace(old2,new2,1))

          i=Path('index.html')
          h=i.read_text()
          oldv='js/wind.js?v=8.56'
          if oldv not in h: raise SystemExit('wind cache version not found')
          i.write_text(h.replace(oldv,'js/wind.js?v=8.62',1))
          PY
          node --check js/wind.js
          grep -q "area>=900000?1" js/wind.js
          grep -q "particleCap=area>=900000" js/wind.js
      - name: Commit optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/wind.js index.html
          git commit -m 'Improve desktop wind animation performance'
          git push origin HEAD:fix/wind-desktop-performance
