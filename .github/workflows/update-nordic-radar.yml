name: Cache official Denmark and Iceland radar
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_nordic_radar.py
      - scripts/requirements-radar.txt
      - scripts/publish_generated_data.sh
      - .github/workflows/update-nordic-radar.yml
permissions:
  contents: write
concurrency:
  group: update-nordic-radar
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-radar.txt
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/nordic-radar-cache.json
            data/radar-cache
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/nordic-radar-cache.json data/radar-cache
      - name: Install official radar decoders
        run: pip install -r scripts/requirements-radar.txt
      - name: Check archive metadata and no-data handling
        run: python3 -m unittest discover -s tests -p test_nordic_radar.py -v
      - name: Refresh transparent official radar frames
        run: python3 scripts/update_nordic_radar.py
      - name: Save radar archive
        run: bash scripts/publish_generated_data.sh 'Refresh official Denmark and Iceland radar frames' data/nordic-radar-cache.json data/radar-cache
