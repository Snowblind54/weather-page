name: Patch wind measurement sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-wind-mode-measurement-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make wind field drive active measured mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/official-wind.js')
          text = path.read_text()
          old = (
              "function syncWindFieldToOfficial(id){\n"
              "  if(!windFieldVisible())return;const selected=$(id);if(!selected.checked)return;\n"
              "  const mode=id==='officialWindGusts'?'gust':'sustained';setOfficialWindMeasurement(mode);\n"
              "  if($('windMode').value!==mode){$('windMode').value=mode;$('windMode').dispatchEvent(new Event('change',{bubbles:true}));}\n"
              "}\n"
          )
          new = (
              "function syncWindFieldToOfficial(){\n"
              "  // Measured controls never change the modeled field. If the field is visible\n"
              "  // and measurements remain enabled, keep the measured layer aligned to the\n"
              "  // field's selected sustained/gust mode instead.\n"
              "  if(!windFieldVisible()||!officialWindEnabled())return;\n"
              "  syncOfficialWindToField();\n"
              "}\n"
              "$('windMode')?.addEventListener('change',syncOfficialWindToField);\n"
          )
          if old not in text:
              raise SystemExit('Expected wind sync block not found')
          text = text.replace(old, new, 1)
          if "'v8.126'" not in text:
              raise SystemExit('Expected official wind version not found')
          path.write_text(text.replace("'v8.126'", "'v8.127'", 1))

          path = Path('js/auto-refresh.js')
          text = path.read_text()
          if "'v8.126'" not in text:
              raise SystemExit('Expected auto-refresh version not found')
          path.write_text(text.replace("'v8.126'", "'v8.127'", 1))

          path = Path('index.html')
          text = path.read_text()
          replacements = [
              ('<title>Northern Weather Map v8.126</title>', '<title>Northern Weather Map v8.127</title>'),
              ('js/official-wind.js?v=8.126', 'js/official-wind.js?v=8.127'),
              ('js/auto-refresh.js?v=1', 'js/auto-refresh.js?v=8.127'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected index text not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run measured wind tests
        run: node --test tests/official-wind.test.cjs tests/test_wind_observation_blend.js
      - name: Commit sync behavior
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/official-wind.js js/auto-refresh.js index.html
          git commit -m 'Sync active wind measurements to field mode'
          git push origin main
