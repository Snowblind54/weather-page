name: Install cyclone fronts UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-cyclone-front-ui.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire fronts into Cyclones panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          css='<link rel="stylesheet" href="css/style.css?v=8.75">'
          css_new=css+'\n<link rel="stylesheet" href="css/cyclone-fronts.css?v=1">'
          assert css in t and 'css/cyclone-fronts.css' not in t
          t=t.replace(css,css_new,1)

          source='NOAA / NCEP GFS model fields for low-pressure centres, pressure, movement, wind, gusts and tracks.'
          source_new=source+' Model-derived cold and warm fronts use the same GFS cycle with 850 hPa temperature and wind; they are an objective diagnostic rather than an official hand-analysed synoptic chart.'
          assert source in t
          t=t.replace(source,source_new,1)

          anchor='      <label class="label control-line"><input id="cycloneHistoryOn" type="checkbox" checked> Past centre tracks · up to 48 h</label>'
          controls='''      <div class="cyclone-front-controls">\n        <label class="label control-line"><input id="cycloneFrontsOn" type="checkbox"> Cold &amp; warm fronts</label>\n        <div class="cyclone-front-key" aria-label="Weather front colours"><span><i class="cyclone-front-swatch cold"></i>Cold front</span><span><i class="cyclone-front-swatch warm"></i>Warm front</span></div>\n        <div id="cycloneFrontsStatus" class="small">Model-derived fronts are off.</div>\n      </div>\n'''+anchor
          assert anchor in t and 'id="cycloneFrontsOn"' not in t
          t=t.replace(anchor,controls,1)

          script='<script src="js/cyclone-details.js?v=8.54"></script>'
          script_new=script+'\n<script src="js/cyclone-fronts.js?v=1"></script>'
          assert script in t and 'js/cyclone-fronts.js' not in t
          t=t.replace(script,script_new,1)

          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate front UI code
        run: |
          node --check js/cyclone-fronts.js
          python3 -m py_compile scripts/update_fronts.py
          grep -q 'id="cycloneFrontsOn"' index.html
          grep -q 'js/cyclone-fronts.js?v=1' index.html
          grep -q 'css/cyclone-fronts.css?v=1' index.html
      - name: Publish cyclone fronts UI
        run: bash scripts/publish_generated_data.sh 'Show cold and warm fronts in Cyclones' index.html
