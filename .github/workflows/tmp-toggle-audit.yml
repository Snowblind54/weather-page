name: Temporary toggle audit
on:
  push:
    branches: [feature/timeline-10min-info-tooltips]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List checkbox contexts
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          for m in re.finditer(r'<input\b[^>]*\btype=["\']checkbox["\'][^>]*>|<input\b[^>]*\bid=["\'][^"\']+["\'][^>]*\btype=["\']checkbox["\'][^>]*>',s,re.I):
              tag=m.group(0)
              mid=re.search(r'id=["\']([^"\']+)',tag,re.I)
              print('\n===',mid.group(1) if mid else '?','===')
              print(re.sub(r'\s+',' ',s[max(0,m.start()-220):min(len(s),m.end()+700)]))
          PY
