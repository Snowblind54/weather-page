name: Brighten wind high-speed spectrum
on:
  push:
    branches: [fix/brighter-wind-high-speeds]
    paths:
      - .github/workflows/brighten-wind-spectrum.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update wind colours
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/wind.js')
          s=p.read_text()
          old="const WIND_COLOUR_STOPS=[\n  {speed:0,color:'#8fdcff'}, {speed:3,color:'#45dfac'},\n  {speed:6,color:'#f5e653'}, {speed:10,color:'#ffad42'},\n  {speed:15,color:'#ff585d'}, {speed:25,color:'#bd75ff'}\n];\nconst WIND_GUST_COLOUR_STOPS=[...WIND_COLOUR_STOPS,{speed:33,color:'#ff52c8'}];"
          new="const WIND_COLOUR_STOPS=[\n  {speed:0,color:'#8fdcff'}, {speed:3,color:'#45dfac'},\n  {speed:6,color:'#f5e653'}, {speed:10,color:'#ffad42'},\n  {speed:15,color:'#ff585d'}, {speed:25,color:'#bd75ff'},\n  // Extreme winds brighten rapidly beyond purple and reach pure white at 34 m/s.\n  {speed:28,color:'#dc7dff'}, {speed:31,color:'#ff72e6'},\n  {speed:33,color:'#ffd4f6'}, {speed:34,color:'#ffffff'}\n];\nconst WIND_GUST_COLOUR_STOPS=WIND_COLOUR_STOPS;"
          if old not in s: raise SystemExit('colour stop block not found')
          s=s.replace(old,new,1)
          old2="const mode=currentWindMode(),gust=mode==='gust',max=gust?33:25;"
          if old2 not in s: raise SystemExit('legend max block not found')
          s=s.replace(old2,"const mode=currentWindMode(),gust=mode==='gust',max=34;",1)
          old3="const ticks=gust?[0,5,10,15,25,33]:[0,5,10,15,20,25];"
          if old3 not in s: raise SystemExit('legend ticks block not found')
          s=s.replace(old3,"const ticks=[0,5,10,15,20,25,30,34];",1)
          p.write_text(s)

          i=Path('index.html')
          h=i.read_text()
          h=h.replace('<title>Northern Weather Map v8.63</title>','<title>Northern Weather Map v8.64</title>',1)
          h=h.replace('js/wind.js?v=8.63','js/wind.js?v=8.64',1)
          h=h.replace('Colours blend gradually with speed, reaching purple at 25 m/s and pink at 33 m/s for gusts.','Colours blend gradually with speed, reaching purple at 25 m/s, bright violet and pink above it, and pure white at 34 m/s and higher.',1)
          i.write_text(h)
          PY
          node --check js/wind.js
          grep -q "speed:34,color:'#ffffff'" js/wind.js
          grep -q "max=34" js/wind.js
          grep -q "js/wind.js?v=8.64" index.html
      - name: Commit spectrum update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/wind.js index.html
          git commit -m 'Brighten extreme wind colour spectrum'
          git push origin HEAD:fix/brighter-wind-high-speeds
