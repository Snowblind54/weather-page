name: Cache ECMWF North America and Atlantic forecast maps

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ecmwf_open_grid.py
      - tests/test_ecmwf_open_grid.py
      - scripts/forecast_precipitation.py
      - scripts/update_canada_forecast.py
      - scripts/update_iceland_forecast.py
      - tests/test_canada_forecast.py
      - .github/workflows/update-canada-forecast.yml

permissions:
  contents: write

concurrency:
  group: forecast-canada-cache
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/forecast-map.json
            data/forecast-canada.json
            data/forecast-canada-cache
          key: r2-input-Cache ECMWF Canada forecast maps-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-Cache ECMWF Canada forecast maps-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/forecast-map.json data/forecast-canada.json data/forecast-canada-cache
      - name: Install GRIB decoder and image renderer
        run: python3 -m pip install numpy==2.3.5 scipy==1.17.0 eccodes==2.46.0 Pillow==11.3.0
      - name: Check ECMWF rendering and Canada forecast cache
        run: python3 -m unittest discover -s tests -p 'test_*forecast*.py' -v
      - name: Verify 9 km source selection
        run: python3 -m unittest discover -s tests -p 'test_ecmwf_open_grid.py' -v
      - name: Generate shared North America and Atlantic forecast maps
        run: python3 scripts/update_canada_forecast.py
      - name: Publish complete North America cache
        run: bash scripts/publish_generated_data.sh 'Refresh ECMWF North America and Atlantic forecast maps' data/forecast-canada.json data/forecast-canada-cache




