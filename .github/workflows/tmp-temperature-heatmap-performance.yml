name: Temporary temperature heatmap performance

on:
  push:
    branches:
      - feat/temperature-heatmap-performance

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/temperature-heatmap-performance
          fetch-depth: 0
      - name: Apply performance patch
        run: python3 scripts/tmp_temperature_perf.py
      - name: Validate JavaScript syntax
        run: node --check js/temperature.js
      - name: Verify optimized implementation
        run: |
          grep -q "buildTemperatureCorrectionRaster" js/temperature.js
          grep -q "Float32Array" js/temperature.js
          grep -q "temperatureAdjustedFromRaster" js/temperature.js
          grep -q "coastlineClipped=clipTemperatureToCountries" js/temperature.js
          grep -q "Northern Weather Map v8.69" index.html
          grep -q "js/temperature.js?v=8.69" index.html
          if grep -q "temperatureNearbyCorrections" js/temperature.js; then exit 1; fi
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/temperature.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize observation-aware temperature heatmap"
            git push origin HEAD:feat/temperature-heatmap-performance
          fi
