name: Guard monthly R2 operations
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/r2_usage_guard.py
      - scripts/github_fallback.py
      - .github/workflows/guard-r2-operations.yml
permissions:
  contents: write
concurrency:
  group: r2-operation-cutoff
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cutoff safeguards
        run: python3 -m unittest discover -s tests -p test_r2_usage_guard.py -v
      - name: Check account operations and update fallback control without R2 requests
        run: python3 scripts/r2_usage_guard.py
