name: Update official Estonia warning forecast

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_estonia_warnings.py
      - tests/test_estonia_warning_forecast.py
      - tests/fixtures/estonia-official-warning-page.html
      - .github/workflows/update-estonia-warnings.yml

permissions:
  contents: write

concurrency:
  group: update-estonia-warnings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check full forecast parser
        run: python3 -m unittest discover -s tests -p test_estonia_warning_forecast.py -v
      - name: Fetch official county and marine forecast warnings
        run: python3 scripts/update_estonia_warnings.py
      - name: Save updated warning forecast
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/estonia-warnings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official Estonia warning forecast'
          git pull --rebase origin main
          git push origin HEAD:main
