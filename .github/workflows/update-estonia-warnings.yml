name: Update official Estonia warning forecast

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_estonia_warnings.py
      - scripts/publish_generated_data.sh
      - tests/test_estonia_warning_forecast.py
      - tests/fixtures/estonia-official-warning-page.html
      - .github/workflows/update-estonia-warnings.yml

permissions:
  contents: write

concurrency:
  group: update-estonia-warnings
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/estonia-warnings.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/estonia-warnings.json
      - name: Check full forecast parser
        run: python3 -m unittest discover -s tests -p test_estonia_warning_forecast.py -v
      - name: Fetch official county and marine forecast warnings
        run: python3 scripts/update_estonia_warnings.py
      - name: Save updated warning forecast
        run: bash scripts/publish_generated_data.sh 'Refresh official Estonia warning forecast' data/estonia-warnings.json
