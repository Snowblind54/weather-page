name: Update official Northern Europe wind
on:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/official_wind_americas.py
      - scripts/update_official_wind.py
      - scripts/publish_generated_data.sh
      - tests/test_official_wind.py
      - js/official-wind.js
      - .github/workflows/update-official-wind.yml
permissions:
  contents: write
concurrency:
  group: update-official-wind
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check official wind adapters
        run: python3 -m unittest discover -s tests -p test_official_wind.py -v
      - name: Fetch measured station wind
        run: python3 scripts/update_official_wind.py
      - name: Save official wind snapshot
        if: ${{ !cancelled() }}
        run: bash scripts/publish_generated_data.sh 'Refresh official Northern Europe wind observations' data/official-wind.json
