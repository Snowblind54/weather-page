name: Update official Northern Europe wind
on:
  schedule:
    - cron: '14,44 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_official_wind.py
      - tests/test_official_wind.py
      - js/official-wind.js
      - .github/workflows/update-official-wind.yml
permissions:
  contents: write
concurrency:
  group: update-official-wind
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check official wind adapters
        run: python3 -m unittest discover -s tests -p test_official_wind.py -v
      - name: Fetch measured station wind
        run: python3 scripts/update_official_wind.py
      - name: Save official wind snapshot
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official-wind.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official Northern Europe wind observations'
          git pull --rebase origin main
          git push origin HEAD:main
