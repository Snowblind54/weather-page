name: Update official Northern Europe wind
on:
  schedule:
    # Each scheduled runner publishes six ten-minute cycles. A half-hourly
    # trigger keeps a successor queued without depending on six punctual crons.
    - cron: '6,36 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/adriatic_observations.py
      - scripts/croatia_synop_stations.json
      - tests/test_adriatic_observations.py
      - tests/adriatic-observations.test.cjs
      - scripts/italy_hungary_observations.py
      - scripts/italy_airport_stations.json
      - tests/test_italy_hungary_observations.py
      - tests/italy-hungary-observations.test.cjs
      - scripts/alpine_observations.py
      - tests/test_alpine_observations.py
      - tests/alpine-observations.test.cjs
      - scripts/iberia_observations.py
      - scripts/spain_airport_stations.json
      - tests/fixtures/spain-airport-metars.json
      - tests/fixtures/aemet-hourly.json
      - tests/fixtures/ipma-stations.json
      - tests/fixtures/ipma-observations.json
      - tests/test_iberia_observations.py
      - tests/iberia-observations.test.cjs
      - scripts/meteofrance_observations.py
      - tests/test_meteofrance_observations.py
      - tests/fixtures/meteofrance-6m.geojson
      - scripts/andorra_observations.py
      - scripts/andorra_stations.json
      - tests/test_france_andorra.py
      - scripts/latvia_observations.py
      - scripts/europe_synop.py
      - scripts/europe_synop_stations.json
      - tests/test_europe_synop.py
      - scripts/official_wind_americas.py
      - scripts/official_wind_us.py
      - scripts/official_wind_atlantic.py
      - scripts/official_wind_western.py
      - scripts/official_wind_scotland.py
      - scripts/southern_balkan_wind_stations.json
      - scripts/official_wind_balkans.py
      - scripts/romania_wind_stations.json
      - scripts/balkan_temperature.py
      - scripts/balkan_temperature_stations.json
      - scripts/southeast_temperature.py
      - scripts/southeast_temperature_stations.json
      - tests/test_official_wind_balkans.py
      - scripts/official_wind_eastern.py
      - scripts/eastern_temperature.py
      - scripts/moldova_belarus_temperature.py
      - scripts/adriatic_greece_temperature.py
      - scripts/ukraine_temperature_stations.json
      - scripts/official_wind_central.py
      - scripts/update_central_temperature.py
      - scripts/update_western_temperature.py
      - scripts/scotland_wind_stations.json
      - scripts/update_us_temperature.py
      - scripts/update_official_wind.py
      - scripts/run_official_wind.py
      - scripts/add_florida_coastal_wind.py
      - scripts/split_official_wind.py
      - scripts/publish_generated_data.sh
      - tests/test_official_wind.py
      - tests/test_official_wind_cycles.py
      - tests/test_official_wind_us.py
      - tests/test_official_wind_atlantic.py
      - tests/test_official_wind_western.py
      - tests/test_official_wind_scotland.py
      - tests/test_official_wind_eastern.py
      - tests/test_official_wind_central.py
      - tests/fixtures/central-wind.json
      - tests/fixtures/scotland-wind.csv
      - tests/fixtures/meteolux-wind.json
      - tests/official-wind.test.cjs
      - js/official-wind.js
      - .github/workflows/update-official-wind.yml
permissions:
  contents: write
concurrency:
  group: update-official-wind
  # A code update replaces an older collector so the new adapters can publish promptly.
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Check Croatian and Slovenian observations
        run: |
          python3 -m unittest discover -s tests -p test_adriatic_observations.py -v
          node --test tests/adriatic-observations.test.cjs
      - name: Check Italian and Hungarian observations
        run: |
          python3 -m unittest discover -s tests -p test_italy_hungary_observations.py -v
          node --test tests/italy-hungary-observations.test.cjs
      - name: Check official Alpine observations
        run: |
          python3 -m unittest discover -s tests -p test_alpine_observations.py -v
          node --test tests/alpine-observations.test.cjs
      - name: Check official Iberian observations
        run: |
          python3 -m unittest discover -s tests -p test_iberia_observations.py -v
          node --test tests/iberia-observations.test.cjs
      - name: Check national Meteo-France observation adapter
        run: python3 -m unittest discover -s tests -p 'test_meteofrance_observations.py' -v
      - name: Check French and Andorran observations
        run: python3 -m unittest discover -s tests -p 'test_france_andorra.py' -v
      - name: Check shared official SYNOP observations
        run: python3 -m unittest discover -s tests -p 'test_europe_synop.py' -v
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/meteofrance-stations.csv
            data/official-wind.json
            data/official-wind-history.json
            data/noaa-temperature-stations.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/official-wind.json data/official-wind-history.json --allow-empty
      - name: Check official wind adapters
        run: python3 -m unittest discover -s tests -p 'test_official_wind*.py' -v
      - name: Check measured wind labels
        run: node --test tests/official-wind.test.cjs tests/test_wind_observation_blend.js tests/wind-chill-americas.test.cjs
      - name: Collect and publish measured wind at ten-minute intervals
        env:
          WIND_CYCLES: ${{ github.event_name == 'schedule' && '6' || '1' }}
        run: python3 scripts/run_official_wind.py --cycles "$WIND_CYCLES"


