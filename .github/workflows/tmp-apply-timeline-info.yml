name: Temporary timeline and toggle info patch
on:
  push:
    branches: [feature/timeline-10min-info-tooltips]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timeline-10min-info-tooltips
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/tmp_apply_timeline_info.py
      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/radar.js
          git diff --check
      - name: Commit production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/app.js js/radar.js css/style.css
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use 10-minute timeline and toggle help tooltips'
          git push origin HEAD:feature/timeline-10min-info-tooltips
