name: Temporary timeline and toggle info patch
on:
  push:
    branches: [feature/timeline-10min-info-tooltips]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Add temporary timeline and tooltip patch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timeline-10min-info-tooltips
          fetch-depth: 0
      - name: Apply UI and timeline changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, name):
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one occurrence of {old!r}, found {text.count(old)}')
              return text.replace(old, new, 1)

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<title>Northern Weather Map v[^<]+</title>', '<title>Northern Weather Map v8.74</title>', s, count=1)
          s=re.sub(r'css/style\.css\?v=[^"\']+', 'css/style.css?v=8.74', s, count=1)
          s=re.sub(r'js/app\.js\?v=[^"\']+', 'js/app.js?v=8.74', s, count=1)
          s=re.sub(r'js/radar\.js\?v=[^"\']+', 'js/radar.js?v=8.74', s, count=1)
          s=replace_once(s,
              '<div id="windHeatmapStatus" class="small" role="status">Wind heatmap is off.</div><div class="small">Heatmap only: fresh official station differences correct the nearby model field. Influence fades smoothly to zero by about 70 km and by 3 hours of observation age. Where no usable station is nearby, the heatmap remains pure model.</div>',
              '<div id="windHeatmapStatus" class="small" role="status">Wind heatmap is off.</div>',
              'index.html wind heatmap help')
          s=replace_once(s,
              '<div class="small">Numbers in m/s at weather stations. Both switches can be on. S = sustained, G = gusts. Click a reading for its station, time and source. Snapshot refreshed every 10 minutes; source observation cadence varies by country. Gusts are reported measurements, not model values.</div>',
              '',
              'index.html official wind help')
          s=replace_once(s,
              '<div class="small">Estonia, Latvia, Lithuania, Finland, Sweden, Norway and Iceland. Click a reading for its station, observation date and source. Dashed labels are older readings. Measurements older than 7 days are hidden. The zero toggle also includes Norway’s &lt;0.5 cm official zero code.</div>',
              '',
              'index.html snow depth help')
          p.write_text(s,encoding='utf-8')

          p=Path('js/radar.js'); s=p.read_text(encoding='utf-8')
          old="""// Keep every radar observation; the cloud view selects only 10-minute slots.\nlet radarTimelineFrames=[],cloudTimelineMode=false;\nfunction updateWeatherTimeline(tenMinutes=cloudTimelineMode){\n  cloudTimelineMode=tenMinutes;\n  if(!radarTimelineFrames.length)return;\n  const selected=frames[Number($('timeline').value)]?.time;\n  const next=tenMinutes?radarTimelineFrames.filter(f=>Math.floor(f.time/60)%10===0):radarTimelineFrames;\n"""
          new="""// Keep every radar observation internally, but the shared 2-hour weather\n// timeline always exposes 10-minute steps for every layer.\nlet radarTimelineFrames=[];\nfunction updateWeatherTimeline(){\n  if(!radarTimelineFrames.length)return;\n  const selected=frames[Number($('timeline').value)]?.time;\n  const next=radarTimelineFrames.filter(f=>Math.floor(f.time/60)%10===0);\n"""
          s=replace_once(s,old,new,'radar timeline selector')
          s=replace_once(s,
              "$('radarStatus').textContent=`Radar: ${frames.length} official 5-minute Estonian frames found.`;",
              "$('radarStatus').textContent=`Radar: ${frames.length} official Estonian frames · 10-minute timeline.`;",
              'radar status')
          old="""    const end=Math.floor(Date.now()/1000/300)*300-300;\n    radarTimelineFrames=Array.from({length:25},(_,i)=>({id:'clock-'+(end-(24-i)*300),time:end-(24-i)*300,url:null}));\n    frames=radarTimelineFrames;$('timeline').min=0;$('timeline').max=24;$('timeline').value=24;updateWeatherTimeline();\n"""
          new="""    const end=Math.floor(Date.now()/1000/600)*600-600;\n    radarTimelineFrames=Array.from({length:13},(_,i)=>({id:'clock-'+(end-(12-i)*600),time:end-(12-i)*600,url:null}));\n    frames=radarTimelineFrames;$('timeline').min=0;$('timeline').max=12;$('timeline').value=12;updateWeatherTimeline();\n"""
          s=replace_once(s,old,new,'radar fallback timeline')
          p.write_text(s,encoding='utf-8')

          p=Path('js/app.js'); s=p.read_text(encoding='utf-8')
          block=r'''

// Compact hover/focus help for every checkbox toggle. The longer explanatory
// copy lives here instead of permanently taking space below the controls.
const TOGGLE_HELP={
  tempOn:'Shows temperature values across Northern Europe. Official station observations are used where available; model values fill gaps and areas without a recent station observation.',
  heatmapOn:'Shows the terrain-aware temperature heatmap. Fresh official station observations locally correct the model field; corrections fade with distance and age, and the layer stays clipped to land and coastlines.',
  windOn:'Shows animated 10 m wind particles across the Atlantic and Europe. The animation follows the selected timeline time and the selected sustained-wind or gust field.',
  windHeatmapOn:'Fresh official station differences correct the nearby model field. Influence fades smoothly to zero by about 70 km and by 3 hours of observation age. Where no usable station is nearby, the heatmap remains pure model.',
  officialWindSustained:'Shows measured sustained wind in m/s at official weather stations. Readings follow the selected timeline time; observations older than 3 hours are hidden. The shared snapshot refreshes every 10 minutes.',
  officialWindGusts:'Shows measured wind gusts in m/s at official weather stations. Gusts are reported measurements, not model values. Readings follow the timeline and the shared snapshot refreshes every 10 minutes.',
  cloudOn:'Shows satellite cloud imagery over the Atlantic and Europe. The imagery follows the shared weather timeline; areas outside current satellite coverage remain transparent.',
  radarOn:'Shows official rain radar over the Baltics and Nordics. The shared 2-hour weather timeline now advances in 10-minute steps.',
  rain1h:'Shows accumulated rainfall over the previous 1 hour.',
  rain24h:'Shows accumulated rainfall over the previous 24 hours.',
  rain48h:'Shows accumulated rainfall over the previous 48 hours.',
  cycloneOn:'Shows tracked low-pressure systems over the North Atlantic and northern Europe, including their current centres and enabled track layers.',
  cycloneIsobarsOn:'Shows pressure contours (isobars) around the cyclone systems. The contours follow the selected cyclone forecast hour.',
  cycloneHistoryOn:'Shows the past movement of cyclone centres for up to 48 hours before the current analysis.',
  cyclonePathsOn:'Shows the most likely projected centre path from the main GFS forecast for the next 72 hours.',
  cycloneSpreadOn:'Shows ensemble track uncertainty from available GEFS members around the projected cyclone path.',
  cyclonePossibleOn:'Shows individual plausible ensemble-member cyclone tracks in addition to the main projected path and uncertainty shading.',
  warningOn:'Shows active official severe-weather warnings from the supported Northern European national weather services.',
  snowOn:'Shows Northern Hemisphere snow cover and sea ice from the selected snow analysis date. The latest layer uses the highest available resolution.',
  snowDepthOn:'Shows official station snow depth in centimetres for Estonia, Latvia, Lithuania, Finland, Sweden, Norway and Iceland. Click a reading for station, observation date and source. Measurements older than 7 days are hidden.',
  snowDepthZero:'Includes stations reporting 0 cm snow depth. This also includes Norway’s official <0.5 cm zero-snow code.'
};
function installToggleHelp(){
  const checkboxes=[...document.querySelectorAll('input[type="checkbox"][id]')];
  let tooltip=document.getElementById('toggleHelpTooltip');
  if(!tooltip){
    tooltip=document.createElement('div');
    tooltip.id='toggleHelpTooltip';
    tooltip.className='toggle-help-tooltip';
    tooltip.setAttribute('role','tooltip');
    tooltip.hidden=true;
    document.body.appendChild(tooltip);
  }
  let activeIcon=null;
  const hide=()=>{tooltip.hidden=true;activeIcon=null;};
  const position=icon=>{
    const r=icon.getBoundingClientRect();
    const pad=10;
    const tr=tooltip.getBoundingClientRect();
    let left=r.left;
    left=Math.max(pad,Math.min(left,window.innerWidth-tr.width-pad));
    let top=r.top-tr.height-8;
    if(top<pad)top=Math.min(window.innerHeight-tr.height-pad,r.bottom+8);
    tooltip.style.left=Math.round(left)+'px';
    tooltip.style.top=Math.round(top)+'px';
  };
  const show=icon=>{
    activeIcon=icon;
    tooltip.textContent=icon.dataset.toggleHelp;
    tooltip.hidden=false;
    requestAnimationFrame(()=>{if(activeIcon===icon)position(icon);});
  };
  for(const input of checkboxes){
    const help=TOGGLE_HELP[input.id];
    const label=input.closest('label');
    if(!help||!label||label.querySelector('.toggle-info-dot'))continue;
    const icon=document.createElement('span');
    icon.className='toggle-info-dot';
    icon.textContent='i';
    icon.tabIndex=0;
    icon.dataset.toggleHelp=help;
    icon.setAttribute('aria-label','Information about '+(input.getAttribute('aria-label')||input.id));
    icon.addEventListener('mouseenter',()=>show(icon));
    icon.addEventListener('mouseleave',hide);
    icon.addEventListener('focus',()=>show(icon));
    icon.addEventListener('blur',hide);
    icon.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();});
    label.insertBefore(icon,input);
  }
  window.addEventListener('resize',hide,{passive:true});
  document.addEventListener('scroll',hide,true);
}
installToggleHelp();
'''
          if 'const TOGGLE_HELP=' in s: raise SystemExit('toggle help already present')
          s += block
          p.write_text(s,encoding='utf-8')

          p=Path('css/style.css'); s=p.read_text(encoding='utf-8')
          css=r'''

/* Per-toggle information help. Kept fixed so panel overflow never clips it. */
.toggle-info-dot{
  display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;box-sizing:border-box;margin-right:7px;
  border:1px solid rgba(205,225,245,.55);border-radius:50%;
  color:#dceeff;background:rgba(22,38,53,.78);
  font-size:11px;font-weight:800;font-style:normal;line-height:1;
  cursor:help;vertical-align:middle;flex:0 0 auto;
}
.toggle-info-dot:hover,.toggle-info-dot:focus{
  color:#fff;border-color:rgba(232,245,255,.95);background:rgba(45,72,95,.96);outline:none;
}
.toggle-help-tooltip{
  position:fixed;z-index:100000;box-sizing:border-box;
  width:max-content;max-width:min(330px,calc(100vw - 20px));
  padding:9px 11px;border:1px solid rgba(180,205,226,.28);border-radius:8px;
  background:rgba(16,24,32,.97);color:#edf6ff;
  box-shadow:0 8px 24px rgba(0,0,0,.38);
  font-size:12px;line-height:1.45;pointer-events:none;
}
.toggle-help-tooltip[hidden]{display:none!important;}
'''
          if '.toggle-help-tooltip{' in s: raise SystemExit('tooltip css already present')
          s += css
          p.write_text(s,encoding='utf-8')
          PY

          node --check js/app.js
          node --check js/radar.js
          git diff --check
      - name: Validate all toggles and 10-minute timeline
        run: |
          python3 - <<'PY'
          import re
          html=open('index.html',encoding='utf-8').read()
          app=open('js/app.js',encoding='utf-8').read()
          radar=open('js/radar.js',encoding='utf-8').read()
          ids=set(re.findall(r'<input\b[^>]*\bid="([^"]+)"[^>]*\btype="checkbox"|<input\b[^>]*\btype="checkbox"[^>]*\bid="([^"]+)"',html))
          ids={a or b for a,b in ids}
          mapping=set(re.findall(r'^\s{2}([A-Za-z0-9_]+):',app,re.M))
          missing=sorted(ids-mapping)
          assert not missing, f'missing tooltip help for toggles: {missing}'
          assert 'Math.floor(f.time/60)%10===0' in radar
          assert 'length:13' in radar and '*600' in radar
          assert 'official 5-minute Estonian frames found' not in radar
          assert 'Heatmap only: fresh official station differences' not in html
          assert 'Numbers in m/s at weather stations. Both switches can be on.' not in html
          assert 'The zero toggle also includes Norway' not in html
          print('Checkboxes with help:',len(ids),sorted(ids))
          print('Timeline validation: 10-minute slots, 13-frame 2-hour fallback')
          PY
      - name: Commit production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/app.js js/radar.js css/style.css
          git diff --cached --check
          git commit -m 'Use 10-minute timeline and toggle help tooltips'
          git push origin HEAD:feature/timeline-10min-info-tooltips
