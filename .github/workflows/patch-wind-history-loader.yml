name: Patch measured wind history

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_wind_history_once.py
      - .github/workflows/patch-wind-history-loader.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/patch_wind_history_once.py
      - run: node --check js/official-wind.js
      - run: node --test tests/official-wind.test.cjs tests/test_wind_observation_blend.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/official-wind.js js/auto-refresh.js index.html
          git commit -m 'Fix 24 hour measured wind history loading'
          git push origin main
