name: Update shared model wind

on:
  schedule:
    - cron: '12 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_model_wind.py
      - scripts/noaa_model_wind.py
      - js/wind.js
      - tests/wind-coverage.test.cjs
      - tests/test_noaa_model_wind.py
      - tests/test_model_wind.py
      - scripts/publish_generated_data.sh
      - .github/workflows/update-model-wind.yml

permissions:
  contents: write

concurrency:
  group: shared-model-wind
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50 numpy==2.3.5 eccodes==2.46.0 pyproj==3.7.2
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/model-wind.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/model-wind.json
      - name: Test wind collection and coverage
        run: |
          python3 -m unittest discover -s tests -p test_model_wind.py -v
          python3 -m unittest discover -s tests -p test_noaa_model_wind.py -v
          node --test tests/wind-coverage.test.cjs tests/wind-source.test.cjs tests/wind-performance.test.cjs tests/wind-chill-americas.test.cjs
      - name: Fetch NOAA and regional shared wind grids
        run: python3 scripts/update_model_wind.py
      - name: Publish shared wind snapshot
        run: bash scripts/publish_generated_data.sh 'Refresh shared wind model snapshot' data/model-wind.json
