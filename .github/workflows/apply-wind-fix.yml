name: Apply Iceland and Norway wind fixes
on:
  push:
    branches: [fix/iceland-norway-wind]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iceland-norway-wind
      - name: Patch official wind adapters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/update_official_wind.py')
          text = path.read_text()
          replacements = {
              "period='10-minute mean wind and reported maximum gust from MET Norway stations.', license='CC BY 4.0')":
              "period='10-minute mean wind and reported hourly maximum gust from MET Norway stations.', license='CC BY 4.0')",
              "timeKind='observation', period='Hourly automatic-station mean wind and reported gust.', license='CC BY 4.0')":
              "timeKind='observation', period='10-minute automatic-station mean wind and reported gust.', license='CC BY 4.0')",
              "OUTPUT = pathlib.Path(__file__).resolve().parents[1] / 'data/official-wind.json'\n":
              "OUTPUT = pathlib.Path(__file__).resolve().parents[1] / 'data/official-wind.json'\nNORWAY_GUST_ELEMENT = 'max(wind_speed_of_gust PT1H)'\nICELAND_LATEST_URL = 'https://api.vedur.is/weather/observations/aws/10min/latest?parameters=basic'\n",
              "if element in ('wind_speed', 'wind_speed_of_gust') and observation.get('unit') == 'm/s':\n                values.setdefault(element, observation.get('value'))":
              "if element in ('wind_speed', NORWAY_GUST_ELEMENT) and observation.get('unit') == 'm/s':\n                values.setdefault(element, observation.get('value'))",
              "if number(values.get('wind_speed')) is None and number(values.get('wind_speed_of_gust')) is None:":
              "if number(values.get('wind_speed')) is None and number(values.get(NORWAY_GUST_ELEMENT)) is None:",
              "grouped.setdefault(code, []).append((row['referenceTime'], values.get('wind_speed'),\n                                             values.get('wind_speed_of_gust'), values.get('wind_from_direction')))":
              "grouped.setdefault(code, []).append((row['referenceTime'], values.get('wind_speed'),\n                                             values.get(NORWAY_GUST_ELEMENT), values.get('wind_from_direction')))" ,
              "for element in ('wind_speed', 'wind_speed_of_gust'):":
              "for element in ('wind_speed', NORWAY_GUST_ELEMENT):",
              "elements='wind_speed,wind_speed_of_gust,wind_from_direction', timeResolution='hours')":
              "elements='wind_speed,' + NORWAY_GUST_ELEMENT + ',wind_from_direction', timeResolution='hours')",
              "observations = download_json('https://api.vedur.is/weather/observations/aws/hour/latest?parameters=basic')":
              "observations = download_json(ICELAND_LATEST_URL)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected script fragment missing: ' + old[:100])
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/test_official_wind.py')
          text = path.read_text()
          old = "{'elementId': 'wind_speed_of_gust', 'unit': 'm/s', 'qualityCode': 2, 'timeSeriesId': 0, 'value': 9.1},"
          new = "{'elementId': w.NORWAY_GUST_ELEMENT, 'unit': 'm/s', 'qualityCode': 2, 'timeSeriesId': 0, 'value': 9.1},"
          if old not in text:
              raise SystemExit('Expected Norway test fragment missing')
          text = text.replace(old, new, 1)
          anchor = "    def test_iceland_uses_f_for_wind_and_fg_for_gust(self):\n"
          addition = "    def test_provider_element_and_current_iceland_endpoint_are_explicit(self):\n        self.assertEqual(w.NORWAY_GUST_ELEMENT, 'max(wind_speed_of_gust PT1H)')\n        self.assertIn('/10min/latest', w.ICELAND_LATEST_URL)\n\n"
          if anchor not in text:
              raise SystemExit('Expected Iceland test anchor missing')
          text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text)
          PY
      - name: Run wind adapter tests
        run: python3 -m unittest discover -s tests -p test_official_wind.py -v
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/apply-wind-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_official_wind.py tests/test_official_wind.py .github/workflows/apply-wind-fix.yml
          git commit -m 'Fix Iceland station coverage and Norway gusts'
          git push origin HEAD:fix/iceland-norway-wind
