name: Update official snow depth
on:
  schedule:
    - cron: '49 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_snow_depth.py
      - scripts/publish_generated_data.sh
      - tests/test_snow_depth.py
      - .github/workflows/update-snow-depth.yml
permissions:
  contents: write
concurrency:
  group: update-official-snow-depth
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/official-snow-depth.json
            data/iceland-snow-stations.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/official-snow-depth.json data/iceland-snow-stations.json
      - name: Test snow-depth adapters
        run: python3 -m unittest discover -s tests -p test_snow_depth.py -v
      - name: Fetch official snow depth
        run: python3 scripts/update_snow_depth.py
      - name: Save station snow-depth snapshot
        run: bash scripts/publish_generated_data.sh 'Refresh official station snow depth' data/official-snow-depth.json data/iceland-snow-stations.json
