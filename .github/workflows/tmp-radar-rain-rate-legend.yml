name: Temporary radar rain-rate legend
on:
  push:
    branches:
      - feature/radar-rain-rate-legend
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/radar-rain-rate-legend
      - name: Add radar rain-rate labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          old='''    <div class="details">\n      <div class="legend"></div>\n      <div id="nordicRadarStatus" class="status" role="status">Nordic radar is off.</div>'''
          new='''    <div class="details">\n      <div class="small">Radar rain rate · mm/h</div>\n      <div class="legend" aria-label="Radar rain-rate colour scale in millimetres per hour"></div>\n      <div class="rain-legend-values"><span>0.1</span><span>0.3</span><span>0.5</span><span>1</span><span>2</span><span>4</span><span>8</span><span>16</span><span>50+ mm/h</span></div>\n      <div id="nordicRadarStatus" class="status" role="status">Nordic radar is off.</div>'''
          if text.count(old)!=1:
              raise SystemExit(f'Radar legend marker match count: {text.count(old)}')
          text=text.replace(old,new,1)
          text=text.replace('Northern Weather Map v8.77','Northern Weather Map v8.78',1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'Radar rain rate · mm/h' index.html
          grep -q '50+ mm/h' index.html
          git diff --check
      - name: Commit production change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-radar-rain-rate-legend.yml
          git add index.html .github/workflows/tmp-radar-rain-rate-legend.yml
          git commit -m 'Add rain-rate values to radar legend'
          git push origin HEAD:feature/radar-rain-rate-legend
