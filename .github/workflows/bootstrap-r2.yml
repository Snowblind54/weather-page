name: Initialize R2 publisher registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/bootstrap_r2.py
      - .github/workflows/bootstrap-r2.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: r2-migration-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - run: python3 -m unittest discover -s tests -p test_r2_storage.py -v
      - run: python3 scripts/bootstrap_r2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-storage-report
          path: r2-storage-report.json
          retention-days: 7
