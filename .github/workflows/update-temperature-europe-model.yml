name: Update European temperature heatmap
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_temperature_europe_model.py
      - scripts/temperature_europe_points.json
      - .github/workflows/update-temperature-europe-model.yml
permissions:
  contents: write
concurrency:
  group: update-temperature-europe-model
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/temperature-europe-model.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py --allow-empty data/temperature-europe-model.json
      - name: Build shared hourly temperature grid
        run: python3 scripts/update_temperature_europe_model.py
      - name: Publish shared heatmap samples
        run: bash scripts/publish_generated_data.sh 'Refresh European temperature heatmap' data/temperature-europe-model.json
