name: Cache MET Nordic forecast maps

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_forecast_map.py
      - .github/workflows/update-forecast-map.yml

permissions:
  contents: write

concurrency:
  group: forecast-map-availability
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/forecast-map.json
            data/forecast-cache
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/forecast-map.json data/forecast-cache
      - name: Install image encoder
        run: python3 -m pip install Pillow==11.3.0
      - name: Save shared MET Nordic forecast images
        run: python3 scripts/update_forecast_map.py
      - name: Publish shared forecast maps
        run: bash scripts/publish_generated_data.sh 'Refresh shared MET Nordic forecast maps' data/forecast-map.json data/forecast-cache
