name: Update MET Nordic forecast map availability

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_forecast_map.py
      - .github/workflows/update-forecast-map.yml

permissions:
  contents: write

concurrency:
  group: forecast-map-availability
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover current MET Nordic forecast grids
        run: python3 scripts/update_forecast_map.py
      - name: Publish forecast map availability
        run: bash scripts/publish_generated_data.sh 'Refresh MET Nordic forecast map availability' data/forecast-map.json
