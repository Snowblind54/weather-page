name: Temporary panel switch patch
on:
  push:
    branches:
      - fix/info-position-panel-switch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/info-position-panel-switch
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/tmp_fix_panel.py
      - name: Validate
        run: |
          node --check js/app.js
          node --check js/ui.js
          git diff --check
          grep -q "input.insertAdjacentElement('afterend',icon)" js/app.js
          if grep -q cloudTimelineMode js/ui.js; then exit 1; fi
          if grep -q syncTimelineCadence js/ui.js; then exit 1; fi
          grep -q "Northern Weather Map v8.75" index.html
      - name: Commit production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/app.js js/ui.js css/style.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve toggle info placement and panel switching"
          git push origin HEAD:fix/info-position-panel-switch
