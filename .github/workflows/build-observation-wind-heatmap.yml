name: Build observation-aware wind heatmap
on:
  push:
    branches: [feature/observation-aware-wind-heatmap]
    paths:
      - .github/workflows/build-observation-wind-heatmap.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Integrate official observations into wind heatmap
        run: |
          python3 -c "import base64;open('/tmp/patch.py','wb').write(base64.b64decode('
...TRUNCATED...'))"
          python3 /tmp/patch.py
          node --check js/wind-observation-blend.js
          node --check js/wind.js
          node --check js/official-wind.js
          node --check js/app.js
          node tests/test_wind_observation_blend.js
          grep -q 'model + .*fresh official readings' js/wind.js
          grep -q 'officialWindNeeded' js/official-wind.js
          grep -q 'wind-observation-blend.js?v=8.65' index.html
      - name: Commit observation-aware heatmap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/wind.js js/official-wind.js js/app.js index.html
          git commit -m 'Blend official observations into wind heatmap'
          git push origin HEAD:feature/observation-aware-wind-heatmap
