name: Show official wind history directly
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch popup
        run: python3 -c "from pathlib import Path; p=Path('js/official-wind.js'); t=p.read_text(encoding='utf-8'); a=t.index('    <button type=\"button\" class=\"official-wind-history-toggle\"'); b=t.index('    <div class=\"wind-popup-meta\" style=\"margin-top:7px\"',a); t=t[:a]+'    \u0024{officialWindHistoryGraph(s,r[0])}\\n'+t[b:]; p.write_text(t,encoding='utf-8'); p=Path('index.html'); t=p.read_text(encoding='utf-8'); assert 'js/official-wind.js?v=8.76' in t; p.write_text(t.replace('js/official-wind.js?v=8.76','js/official-wind.js?v=8.77',1),encoding='utf-8')"
      - name: Validate
        run: |
          node --check js/official-wind.js
          grep -q 'officialWindHistoryGraph(s,r\[0\])' js/official-wind.js
          ! grep -q 'Show 24 h history' js/official-wind.js
          grep -q 'official-wind.js?v=8.77' index.html
      - name: Publish
        run: bash scripts/publish_generated_data.sh 'Show official wind history directly in popup' js/official-wind.js index.html
