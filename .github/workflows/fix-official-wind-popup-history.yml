name: Fix official wind popup history
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch popup interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/official-wind.js')
          t = p.read_text(encoding='utf-8')
          a = "const root=popup.getElement();if(!root)return;"
          b = "const root=popup.getElement();if(!root)return;\n  L.DomEvent.disableClickPropagation(root);\n  L.DomEvent.disableScrollPropagation(root);"
          assert a in t
          t = t.replace(a, b, 1)
          a = "button.addEventListener('click',()=>{"
          b = "button.addEventListener('click',event=>{\n    event.preventDefault();\n    event.stopPropagation();\n    L.DomEvent.stopPropagation(event);"
          assert a in t
          t = t.replace(a, b, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          assert 'js/official-wind.js?v=8.74' in t
          p.write_text(t.replace('js/official-wind.js?v=8.74','js/official-wind.js?v=8.75',1), encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check js/official-wind.js
          grep -q 'L.DomEvent.disableClickPropagation(root)' js/official-wind.js
          grep -q 'official-wind.js?v=8.75' index.html
      - name: Publish
        run: bash scripts/publish_generated_data.sh 'Keep official wind history popup open' js/official-wind.js index.html
