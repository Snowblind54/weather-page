name: Prepare satellite cloud tiles
on:
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_cloud_tiles.cjs
      - scripts/cloud-tiles/**
      - js/cloud-pixels.js
      - js/cloud-arctic-source.js
      - js/cloud-eumet-cleanup.js
      - js/cloud-nordic-coverage.js
      - .github/workflows/update-cloud-tiles.yml
permissions:
  contents: write
concurrency:
  group: update-cloud-tiles
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install boto3==1.40.50
      - run: npm ci --prefix scripts/cloud-tiles
      - uses: actions/cache@v4
        with:
          path: |
            data/cloud-tiles.json
            data/cloud-tiles
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore last successful cloud archive
        run: python3 scripts/hydrate_r2_data.py --allow-empty data/cloud-tiles.json data/cloud-tiles
      - name: Test prepared satellite delivery
        run: node --test tests/cloud-prepared.test.cjs
      - name: Prepare transparent clouds and preserve failed-provider frames
        run: node scripts/update_cloud_tiles.cjs
      - name: Publish verified cloud images before their manifest
        run: bash scripts/publish_generated_data.sh 'Refresh prepared satellite clouds' data/cloud-tiles.json data/cloud-tiles
