name: Prepare satellite cloud tiles
on:
  schedule:
    # Keep newest clouds on a 10-minute cadence, but only do the expensive
    # two-hour history backfill on every other scheduled run so the queue
    # cannot drift progressively behind real time.
    - cron: '9,29,49 * * * *'
    - cron: '19,39,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_cloud_tiles.cjs
      - scripts/cloud_archive.cjs
      - scripts/migrate_cloud_archives.cjs
      - scripts/check_cloud_archives.py
      - tests/cloud-archive.test.cjs
      - tests/cloud-prepared.test.cjs
      - tests/cloud-canada.test.cjs
      - scripts/cloud-tiles/**
      - js/cloud-pixels.js
      - js/cloud-arctic-source.js
      - js/cloud-eumet-cleanup.js
      - js/cloud-nordic-coverage.js
      - .github/workflows/update-cloud-tiles.yml
permissions:
  contents: write
concurrency:
  group: update-cloud-tiles
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install boto3==1.40.50
      - run: npm ci --prefix scripts/cloud-tiles
      - uses: actions/cache@v4
        with:
          path: |
            data/cloud-tiles.json
            data/cloud-tiles
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore last successful cloud archive
        run: python3 scripts/hydrate_r2_data.py --allow-empty data/cloud-tiles.json data/cloud-tiles
      - name: Test prepared satellite delivery
        run: node --test tests/cloud-prepared.test.cjs tests/cloud-archive.test.cjs tests/cloud-canada.test.cjs
      - name: Pack the existing verified satellite snapshot on migration
        if: github.event_name == 'push'
        run: node scripts/migrate_cloud_archives.cjs
      - name: Prepare newest transparent clouds and preserve failed-provider frames
        run: node scripts/update_cloud_tiles.cjs --latest
      - name: Publish newest satellite frames immediately
        run: bash scripts/publish_generated_data.sh 'Refresh newest satellite clouds' data/cloud-tiles.json data/cloud-tiles
      - name: Backfill satellite history after newest frames are available
        if: github.event_name != 'schedule' || github.event.schedule == '19,39,59 * * * *'
        run: node scripts/update_cloud_tiles.cjs --history
      - name: Publish completed satellite history
        if: github.event_name != 'schedule' || github.event.schedule == '19,39,59 * * * *'
        run: bash scripts/publish_generated_data.sh 'Refresh satellite cloud history' data/cloud-tiles.json data/cloud-tiles
      - name: Verify browser access and partial satellite downloads after migration
        if: github.event_name == 'push'
        run: python3 scripts/check_cloud_archives.py
