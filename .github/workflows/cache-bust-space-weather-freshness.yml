name: One-time Space Weather freshness cache bust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-bust-space-weather-freshness.yml

permissions:
  contents: write

jobs:
  bust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump Space Weather dashboard asset versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('js/config.js')
          text = config.read_text(encoding='utf-8')
          old = "dashboardScript.src='js/space-weather-dashboard.js?v=1';"
          new = "dashboardScript.src='js/space-weather-dashboard.js?v=2';"
          if old not in text:
              raise SystemExit('Expected dashboard asset version was not found')
          config.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'js/config.js?v=8.83'
          new = 'js/config.js?v=8.84'
          if old not in text:
              raise SystemExit('Expected config asset version was not found')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Publish cache bust
        run: bash scripts/publish_generated_data.sh 'Bust Space Weather freshness cache' js/config.js index.html
