name: Inspect official wind source formats
on:
  push:
    branches: [main]
    paths: [scripts/inspect_wind_sources.py, .github/workflows/inspect-wind-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_wind_sources.py
