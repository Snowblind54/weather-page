name: One-time fix Canada cloud blocks

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-canada-cloud-blocks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch prepared Canada cloud rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          # Prepared overview tiles should be spatially coherent. The browser may
          # still use nowCOAST for close/direct CONUS fallback, but the shared
          # prepared mosaic uses full-disk GOES across North America.
          p = Path('js/cloud-nordic-coverage.js')
          s = p.read_text(encoding='utf-8')
          old = """          const fast=(1-east)*Math.max(0,Math.min(1,conus));
          const fullDisk=(1-east)*(1-fast);"""
          new = """          const preparedFullDisk=typeof globalThis!=='undefined'&&globalThis.cloudPreparedFullDisk===true;
          const fast=preparedFullDisk?0:(1-east)*Math.max(0,Math.min(1,conus));
          const fullDisk=(1-east)*(1-fast);"""
          if old not in s:
              raise SystemExit('CONUS routing anchor not found')
          s = s.replace(old, new, 1)
          old = """        if(metopReady && lat>=64 && lat<=85 && lon>=-170 && lon<=-32){
          const polar=smoothstep(64,73,lat)*smoothstep(-170,-155,lon)*"""
          new = """        if(metopReady && lat>=70 && lat<=85 && lon>=-170 && lon<=-32){
          // GOES has a strong view through mid-Canada. Start the polar handoff
          // farther north so a small Metop contribution cannot make an entire
          // overview block depend on a patchy polar composite.
          const polar=smoothstep(70,79,lat)*smoothstep(-170,-155,lon)*"""
          if old not in s:
              raise SystemExit('Canadian polar handoff anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/update_cloud_tiles.cjs')
          s = p.read_text(encoding='utf-8')
          old = """ const c=runtime();
 // History uses the same source timestamps as the already published latest pass."""
          new = """ const c=runtime();
 // Prepared overview blocks use one continuous full-disk GOES mosaic across
 // North America. This avoids a large z4 block switching between the CONUS
 // mosaic and full-disk imagery at the Canadian border.
 c.cloudPreparedFullDisk=true;
 // History uses the same source timestamps as the already published latest pass."""
          if old not in s:
              raise SystemExit('runtime flag anchor not found')
          s = s.replace(old, new, 1)
          old = """   const t=tasks[cursor++];const local=runtime();
   Object.assign(vm.runInContext('cloudProducts',local),products);
   local.cloudImagePixels=c.cloudImagePixels;local.coords=t.coords;local.requested=t.time;"""
          new = """   const t=tasks[cursor++];const local=runtime();
   local.cloudPreparedFullDisk=true;
   Object.assign(vm.runInContext('cloudProducts',local),products);
   local.cloudImagePixels=c.cloudImagePixels;local.coords=t.coords;local.requested=t.time;"""
          if old not in s:
              raise SystemExit('worker runtime anchor not found')
          s = s.replace(old, new, 1)
          old = """    const ids=vm.runInContext('cloudTileSources(coords)',local);
    const sources=await Promise.all(ids.map(id=>{local.sourceId=id;return vm.runInContext('cloudLoadSource(sourceId,coords,requested)',local);}));
    // Keep the smoothing neighbourhood tied to native browser pixels. z2/z3"""
          new = """    const ids=vm.runInContext('cloudTileSources(coords)',local);
    const settled=await Promise.allSettled(ids.map(id=>{local.sourceId=id;return vm.runInContext('cloudLoadSource(sourceId,coords,requested)',local);}));
    const sources=settled.filter(r=>r.status==='fulfilled').map(r=>r.value);
    const failedIds=settled.flatMap((r,i)=>r.status==='rejected'?[ids[i]]:[]);
    if(!sources.length)throw Error('All satellite sources failed: '+failedIds.join(','));
    if(failedIds.length){
      // Never let one intermittent provider erase a whole prepared block. Use
      // the surviving overlapping satellite source and renormalize its weight.
      local.availableCloudSourceIds=new Set(sources.map(s=>s.id));
      vm.runInContext(`
        const cloudWeightsBeforePreparedFallback=cloudSourceWeights;
        cloudSourceWeights=(lat,lon)=>{
          const weights=cloudWeightsBeforePreparedFallback(lat,lon);let total=0;
          for(const id of Object.keys(weights)){
            if(!availableCloudSourceIds.has(id))weights[id]=0;
            total+=weights[id]||0;
          }
          if(total>0)for(const id of Object.keys(weights))weights[id]=(weights[id]||0)/total;
          return weights;
        };
      `,local);
      errors.push(t.key+': recovered without '+failedIds.join(','));
    }
    // Keep the smoothing neighbourhood tied to native browser pixels. z2/z3"""
          if old not in s:
              raise SystemExit('source-loading anchor not found')
          s = s.replace(old, new, 1)
          # Make provider failures visible in Action logs so future block gaps
          # cannot silently survive a successful workflow.
          old = """   }catch(e){errors.push(t.key+': '+e.message);}"""
          new = """   }catch(e){const message=t.key+': '+e.message;errors.push(message);console.warn('Satellite block failed',message);}"""
          if old not in s:
              raise SystemExit('error logging anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/cloud-prepared.test.cjs')
          s = p.read_text(encoding='utf-8')
          anchor = """test('CONUS uses the fast mosaic while Canada, Alaska and Hawaii use full-disk GOES',()=>{"""
          test = """test('Prepared Canada overview stays on continuous full-disk GOES without a mid-Canada polar dependency',()=>{\n const c=producer.runtime();c.cloudPreparedFullDisk=true;\n for(const coords of [{z:4,x:3,y:4},{z:4,x:4,y:4},{z:4,x:3,y:5},{z:4,x:4,y:5}]){\n  c.coords=coords;const ids=vm.runInContext('cloudTileSources(coords)',c);\n  assert(!ids.includes('noaa'),`${coords.z}/${coords.x}/${coords.y} must not mix the CONUS mosaic into prepared overview blocks`);\n  assert(ids.includes('gibs')||ids.includes('west'),`${coords.z}/${coords.x}/${coords.y} needs full-disk GOES`);\n  if(coords.y===4)assert(!ids.includes('metop'),`${coords.z}/${coords.x}/${coords.y} should not depend on Metop in mid-Canada`);\n }\n});\n"""
          if test not in s:
              if anchor not in s:
                  raise SystemExit('test insertion anchor not found')
              s = s.replace(anchor, test + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          node --test tests/cloud-prepared.test.cjs tests/cloud-canada.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/cloud-nordic-coverage.js scripts/update_cloud_tiles.cjs tests/cloud-prepared.test.cjs
          git commit -m 'Fix rectangular Canada satellite cloud blocks'
          git push
