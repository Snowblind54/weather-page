name: Add temperature history and freshness dashboard
on: [push]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration changes
        run: python3 scripts/install_temperature_history_freshness.py
      - name: Validate code
        run: |
          python3 -m py_compile scripts/update_official_temperature.py scripts/update_official_temperature_all.py
          node --check js/stations.js
          node --check js/clouds.js
          node --check js/config.js
          node --check js/temperature-history.js
          node --check js/data-freshness.js
          grep -q 'js/temperature-history.js?v=1' js/config.js
          grep -q 'js/data-freshness.js?v=1' js/config.js
          grep -q 'js/config.js?v=8.89' index.html
          grep -q 'js/stations.js?v=8.74' index.html
          grep -q 'js/clouds.js?v=8.34' index.html
      - name: Validate 24-hour temperature build
        run: |
          python3 scripts/update_official_temperature_all.py
          python3 - <<'PY'
          import json
          p=json.load(open('data/official-temperature.json',encoding='utf-8'))
          assert p['version']==1
          assert p['historyHours']==24
          assert p['sources'].get('EE',{}).get('count',0)>0
          assert any(s.get('country')=='EE' and s.get('rows') for s in p['stations'])
          print('stations',len(p['stations']),'Estonia',p['sources']['EE'])
          PY
      - name: Publish feature code
        run: bash scripts/publish_generated_data.sh 'Add temperature history and data freshness dashboard' scripts/update_official_temperature.py js/stations.js js/clouds.js js/config.js index.html
