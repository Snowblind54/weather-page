name: Apply four-country wind integration
on:
  push:
    branches: [feature/wind-lv-lt-pl-dk]
    paths:
      - .github/workflows/apply-four-country-wind.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wind-lv-lt-pl-dk
      - name: Patch official wind pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/update_official_wind.py'); s=p.read_text()
          s=s.replace('"""Hourly shared snapshots of official Nordic station wind; never substitute models.', '"""30-minute shared snapshots of official Northern European station wind; never substitute models.')
          s=s.replace("    'IS': dict(name='Icelandic Meteorological Office (IMO)', url='https://api.vedur.is/weather/',\n               timeKind='observation', period='10-minute automatic-station mean wind and reported gust.', license='CC BY 4.0'),\n}", "    'IS': dict(name='Icelandic Meteorological Office (IMO)', url='https://api.vedur.is/weather/',\n               timeKind='observation', period='10-minute automatic-station mean wind and reported gust.', license='CC BY 4.0'),\n    'LV': dict(name='Latvian Environment, Geology and Meteorology Centre (LVĢMC)',\n               url='https://data.gov.lv/dati/lv/dataset/hidrometeorologiskie-noverojumi', timeKind='observation',\n               period='Observed mean wind, maximum gust and direction from the operational meteorological feed.',\n               license='CC0 1.0'),\n    'LT': dict(name='Lithuanian Hydrometeorological Service (LHMT)', url='https://api.meteo.lt/',\n               timeKind='observation', period='Hourly measured wind speed, maximum hourly gust and direction.'),\n    'PL': dict(name='Institute of Meteorology and Water Management (IMGW-PIB)',\n               url='https://danepubliczne.imgw.pl/', timeKind='observation',\n               period='Measured mean wind and reported 10-minute gust; missing gust reports remain unavailable.'),\n    'DK': dict(name='Danish Meteorological Institute (DMI)', url='https://www.dmi.dk/friedata/',\n               timeKind='observation', period='10-minute mean wind and highest 3-second mean wind in the latest 10 minutes.'),\n}")
          s=s.replace("if not (53 <= lat <= 72.5 and -26 <= lon <= 33):", "if not (49 <= lat <= 72.5 and -26 <= lon <= 33):")
          anchor="\ndef load_estonia(now):\n"
          insert=r'''

def parse_latvia(payloads, metadata):
    stations = {str(x.get('STATION_ID')): x for x in metadata if x.get('STATION_ID')}
    by_station = {}
    indexes = {'WNS10': 1, 'WPGST': 2, 'WNDD10': 3}
    for abbreviation, records in payloads.items():
        index = indexes[abbreviation]
        for item in records:
            code = str(item.get('STATION_ID', ''))
            if code not in stations or not item.get('DATETIME'):
                continue
            stamp = timestamp(item['DATETIME'])
            rows = by_station.setdefault(code, {})
            row = rows.setdefault(stamp, [stamp, None, None, None])
            row[index] = item.get('VALUE')
    result = []
    for code, rows in by_station.items():
        meta = stations[code]
        if not any(number(r[1]) is not None or number(r[2]) is not None for r in rows.values()):
            continue
        result.append(station('LV', code, meta.get('NAME') or code, meta['GEOGR2'], meta['GEOGR1'], rows.values()))
    return result


def parse_lithuania(payload):
    meta = payload.get('station') or {}
    coords = meta.get('coordinates') or {}
    rows = [(r.get('observationTimeUtc'), r.get('windSpeed'), r.get('windGust'), r.get('windDirection'))
            for r in payload.get('observations') or []
            if r.get('observationTimeUtc') and (number(r.get('windSpeed')) is not None or number(r.get('windGust')) is not None)]
    if not rows:
        return None
    return station('LT', meta.get('code'), meta.get('name') or meta.get('code'),
                   coords.get('latitude'), coords.get('longitude'), rows)


def parse_poland(payload):
    result = []
    for item in payload if isinstance(payload, list) else []:
        if not item.get('kod_stacji') or item.get('lat') is None or item.get('lon') is None:
            continue
        rows = {}
        fields = (
            ('wiatr_srednia_predkosc', 'wiatr_srednia_predkosc_data', 1),
            ('wiatr_poryw_10min', 'wiatr_poryw_10min_data', 2),
            ('wiatr_kierunek', 'wiatr_kierunek_data', 3),
        )
        for value_key, time_key, index in fields:
            value, stamp = item.get(value_key), item.get(time_key)
            if value is None or not stamp:
                continue
            stamp = timestamp(stamp)
            row = rows.setdefault(stamp, [stamp, None, None, None])
            row[index] = value
        if not any(number(r[1]) is not None or number(r[2]) is not None for r in rows.values()):
            continue
        result.append(station('PL', item['kod_stacji'], item.get('nazwa_stacji') or item['kod_stacji'],
                              item['lat'], item['lon'], rows.values()))
    return result


def parse_denmark(payloads, metadata):
    stations = {}
    for feature in metadata.get('features') or []:
        props = feature.get('properties') or {}
        coords = (feature.get('geometry') or {}).get('coordinates') or []
        if props.get('owner') == 'DMI' and props.get('country') == 'DNK' and len(coords) >= 2:
            stations[str(props.get('stationId'))] = (props.get('name') or props.get('stationId'), coords[1], coords[0])
    grouped = {}
    indexes = {'wind_speed': 1, 'wind_max': 2, 'wind_dir': 3}
    for parameter, payload in payloads.items():
        index = indexes[parameter]
        for feature in payload.get('features') or []:
            props = feature.get('properties') or {}
            code = str(props.get('stationId', ''))
            if code not in stations or props.get('parameterId') != parameter or not props.get('observed'):
                continue
            stamp = timestamp(props['observed'])
            rows = grouped.setdefault(code, {})
            row = rows.setdefault(stamp, [stamp, None, None, None])
            row[index] = props.get('value')
    result = []
    for code, rows in grouped.items():
        name, lat, lon = stations[code]
        if any(number(r[1]) is not None or number(r[2]) is not None for r in rows.values()):
            result.append(station('DK', code, name, lat, lon, rows.values()))
    return result


def load_latvia(now):
    api = 'https://data.gov.lv/dati/api/3/action/datastore_search?'
    obs_resource = '17460efb-ae99-4d1d-8144-1068f184b05f'
    station_resource = 'c32c7afd-0d05-44fd-8b24-1de85b4bf11d'
    metadata = download_json(api + urllib.parse.urlencode({'resource_id': station_resource, 'limit': 1000}))['result']['records']
    payloads = {}
    for abbreviation in ('WNS10', 'WPGST', 'WNDD10'):
        params = {'resource_id': obs_resource, 'limit': 5000, 'sort': 'DATETIME desc',
                  'filters': json.dumps({'ABBREVIATION': abbreviation})}
        payloads[abbreviation] = download_json(api + urllib.parse.urlencode(params))['result']['records']
    return parse_latvia(payloads, metadata)


def load_lithuania(now):
    stations = download_json('https://api.meteo.lt/v1/stations')
    def collect(meta):
        try:
            return parse_lithuania(download_json('https://api.meteo.lt/v1/stations/' +
                                                  urllib.parse.quote(meta['code']) + '/observations/latest'))
        except Exception as error:
            print('LT station unavailable:', meta.get('code'), str(error)[:120], flush=True)
            return None
    with futures.ThreadPoolExecutor(max_workers=8) as pool:
        return [x for x in pool.map(collect, stations) if x is not None]


def load_poland(now):
    return parse_poland(download_json('https://danepubliczne.imgw.pl/api/data/meteo'))


def load_denmark(now):
    base = 'https://opendataapi.dmi.dk/v2/metObs/collections/'
    metadata = download_json(base + 'station/items?' + urllib.parse.urlencode({
        'status': 'Active', 'bbox': '7,54,16,58', 'limit': 1000
    }))
    def observation(parameter):
        params = {'parameterId': parameter, 'period': 'latest-hour', 'bbox': '7,54,16,58', 'limit': 1000}
        return download_json(base + 'observation/items?' + urllib.parse.urlencode(params))
    with futures.ThreadPoolExecutor(max_workers=3) as pool:
        values = list(pool.map(observation, ('wind_speed', 'wind_max', 'wind_dir')))
    return parse_denmark(dict(zip(('wind_speed', 'wind_max', 'wind_dir'), values)), metadata)
'''
          if anchor not in s: raise SystemExit('loader anchor missing')
          s=s.replace(anchor, insert+anchor)
          s=s.replace("    loaders = [('EE', load_estonia), ('FI', load_finland), ('SE', load_sweden),\n               ('NO', load_norway), ('IS', load_iceland)]", "    loaders = [('EE', load_estonia), ('FI', load_finland), ('SE', load_sweden), ('NO', load_norway),\n               ('IS', load_iceland), ('LV', load_latvia), ('LT', load_lithuania), ('PL', load_poland),\n               ('DK', load_denmark)]")
          s=s.replace("refreshMinutes=60", "refreshMinutes=30")
          p.write_text(s)

          p=Path('js/official-wind.js'); s=p.read_text()
          s=s.replace("const OFFICIAL_WIND_COUNTRIES=['EE','FI','SE','NO','IS'];", "const OFFICIAL_WIND_COUNTRIES=['EE','LV','LT','FI','SE','NO','DK','IS','PL'];")
          s=s.replace("const OFFICIAL_WIND_COUNTRY_NAMES={EE:'Estonia',FI:'Finland',SE:'Sweden',NO:'Norway',IS:'Iceland'};", "const OFFICIAL_WIND_COUNTRY_NAMES={EE:'Estonia',LV:'Latvia',LT:'Lithuania',FI:'Finland',SE:'Sweden',NO:'Norway',DK:'Denmark',IS:'Iceland',PL:'Poland'};")
          s=s.replace("  IS:'https://api.vedur.is/weather/'\n};", "  IS:'https://api.vedur.is/weather/',\n  LV:'https://data.gov.lv/dati/lv/dataset/hidrometeorologiskie-noverojumi',\n  LT:'https://api.meteo.lt/',\n  PL:'https://danepubliczne.imgw.pl/',\n  DK:'https://www.dmi.dk/friedata/'\n};")
          s=s.replace("data.refreshMinutes!==60", "data.refreshMinutes!==30")
          s=s.replace("s.lat<53", "s.lat<49")
          s=s.replace("s.stations.length>1500", "s.stations.length>2500")
          s=s.replace("Updated hourly on this map.", "Updated every 30 minutes on this map.")
          s=s.replace(" · hourly updates", " · 30-minute updates")
          p.write_text(s)

          p=Path('tests/test_official_wind.py'); s=p.read_text()
          marker="\n\nif __name__ == '__main__':\n"
          tests=r'''

    def test_latvia_merges_official_wind_fields_by_station_and_time(self):
        metadata = [{'STATION_ID': 'RIGA', 'NAME': 'Riga', 'GEOGR1': 24.1, 'GEOGR2': 56.95}]
        payloads = {
            'WNS10': [{'STATION_ID': 'RIGA', 'DATETIME': '2026-10-05T09:00:00', 'VALUE': 4.2}],
            'WPGST': [{'STATION_ID': 'RIGA', 'DATETIME': '2026-10-05T09:00:00', 'VALUE': 8.8}],
            'WNDD10': [{'STATION_ID': 'RIGA', 'DATETIME': '2026-10-05T09:00:00', 'VALUE': 240}],
        }
        self.assertEqual(w.parse_latvia(payloads, metadata)[0]['rows'], [[STAMP + 7200, 4.2, 8.8, 240]])

    def test_lithuania_keeps_hourly_measured_wind_and_gust(self):
        payload = {'station': {'code': 'vilniaus-ams', 'name': 'Vilnius AMS',
                               'coordinates': {'latitude': 54.63, 'longitude': 25.1}},
                   'observations': [{'observationTimeUtc': '2026-10-05 09:00:00', 'windSpeed': 3.1,
                                     'windGust': 7.2, 'windDirection': 250}]}
        self.assertEqual(w.parse_lithuania(payload)['rows'], [[STAMP + 7200, 3.1, 7.2, 250]])

    def test_poland_does_not_turn_maximum_wind_into_missing_gust(self):
        payload = [{'kod_stacji': 'PL1', 'nazwa_stacji': 'Polish station', 'lat': '52.0', 'lon': '21.0',
                    'wiatr_srednia_predkosc': '4', 'wiatr_srednia_predkosc_data': '2026-10-05 09:00:00',
                    'wiatr_predkosc_maksymalna': '12', 'wiatr_predkosc_maksymalna_data': '2026-10-05 09:00:00',
                    'wiatr_poryw_10min': None, 'wiatr_poryw_10min_data': None,
                    'wiatr_kierunek': '250', 'wiatr_kierunek_data': '2026-10-05 09:00:00'}]
        self.assertEqual(w.parse_poland(payload)[0]['rows'], [[STAMP + 7200, 4.0, None, 250]])

    def test_denmark_merges_same_time_10min_mean_and_three_second_max(self):
        metadata = {'features': [{'geometry': {'coordinates': [12.0, 55.5]},
                    'properties': {'owner': 'DMI', 'country': 'DNK', 'stationId': '06180', 'name': 'Danish station'}}]}
        def feature(parameter, value):
            return {'properties': {'parameterId': parameter, 'stationId': '06180',
                                   'observed': '2026-10-05T09:00:00Z', 'value': value}}
        payloads = {'wind_speed': {'features': [feature('wind_speed', 5.0)]},
                    'wind_max': {'features': [feature('wind_max', 9.5)]},
                    'wind_dir': {'features': [feature('wind_dir', 230)]}}
        self.assertEqual(w.parse_denmark(payloads, metadata)[0]['rows'], [[STAMP + 7200, 5.0, 9.5, 230]])
'''
          if marker not in s: raise SystemExit('test marker missing')
          s=s.replace(marker, tests+marker)
          p.write_text(s)
          PY
      - name: Run tests and syntax checks
        run: |
          python3 -m unittest discover -s tests -p test_official_wind.py -v
          python3 -m py_compile scripts/update_official_wind.py
          node --check js/official-wind.js
      - name: Commit integration and remove helper workflows
        run: |
          rm -f .github/workflows/apply-four-country-wind.yml .github/workflows/diagnose-four-country-wind.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_official_wind.py js/official-wind.js tests/test_official_wind.py .github/workflows
          git commit -m 'Add official wind for Latvia Lithuania Poland and Denmark'
          git push origin HEAD:feature/wind-lv-lt-pl-dk
