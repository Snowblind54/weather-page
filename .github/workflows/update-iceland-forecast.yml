name: Cache ECMWF Iceland forecast maps

on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_iceland_forecast.py
      - .github/workflows/update-iceland-forecast.yml

permissions:
  contents: read

concurrency:
  group: forecast-iceland-cache
  cancel-in-progress: false

env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/forecast-iceland.json
            data/forecast-iceland-cache
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/forecast-iceland.json data/forecast-iceland-cache
      - name: Install GRIB decoder and image renderer
        run: python3 -m pip install numpy==2.3.5 scipy==1.17.0 eccodes==2.46.0 Pillow==11.3.0
      - name: Generate shared Iceland forecast maps
        run: python3 scripts/update_iceland_forecast.py
      - name: Publish complete Iceland cache
        run: bash scripts/publish_generated_data.sh 'Refresh ECMWF Iceland forecast maps' data/forecast-iceland.json data/forecast-iceland-cache
