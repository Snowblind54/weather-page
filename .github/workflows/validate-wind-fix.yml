name: Validate Iceland and Norway wind fix
on:
  push:
    branches: [fix/iceland-norway-wind]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iceland-norway-wind
      - name: Run official wind updater
        run: python3 scripts/update_official_wind.py
      - name: Verify current Iceland coverage and Norway gusts
        run: |
          python3 - <<'PY'
          import json, time
          data=json.load(open('data/official-wind.json'))
          now=time.time()
          def fresh(country):
              return [s for s in data['stations'] if s['country']==country and s['rows'] and 0 <= now-s['rows'][-1][0] <= 3*3600]
          iceland=fresh('IS')
          norway=fresh('NO')
          norway_gust=[s for s in norway if s['rows'][-1][2] is not None]
          reyk=[s for s in iceland if s['code']=='1475']
          print('Iceland fresh:',len(iceland),'Reykjavik:',reyk[:1])
          print('Norway fresh:',len(norway),'with gust:',len(norway_gust))
          assert len(iceland) >= 200, 'Too few current Iceland stations'
          assert reyk, 'Reykjavik station 1475 missing'
          assert len(norway_gust) >= 100, 'Too few Norwegian stations with gust data'
          PY
