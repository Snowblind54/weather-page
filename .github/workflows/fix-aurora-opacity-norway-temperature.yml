name: One-time aurora opacity and Norway temperature fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-aurora-opacity-norway-temperature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('js/space-weather-v4.js', "updateWhenIdle:true,pane:'spaceWeatherPane',opacity:Number($('auroraOpacity')?.value||68)/100,", "updateWhenIdle:true,pane:'spaceWeatherPane',opacity:1,")
          replace_once('js/space-weather-v4.js', "  function bindControls(){\n    const aurora=$('auroraOn'),viewing=$('auroraViewingOn'),opacity=$('auroraOpacity');\n    if(!aurora||!viewing||!opacity)return;\n", "  function bindControls(){\n    const aurora=$('auroraOn'),viewing=$('auroraViewingOn');\n    if(!aurora||!viewing)return;\n")
          replace_once('js/space-weather-v4.js', "    opacity.addEventListener('input',()=>{\n      $('auroraOpacityVal').textContent=opacity.value+'%';\n      const value=Number(opacity.value)/100;\n      auroraLayer?.setOpacity(value);\n      viewingLayer?.setOpacity(value);\n    });\n", "")

          replace_once('js/config.js', "      <label class=\"small\" for=\"auroraOpacity\">Layer opacity</label>\n      <div class=\"grid2\"><input id=\"auroraOpacity\" type=\"range\" min=\"20\" max=\"90\" value=\"68\" step=\"2\"><span id=\"auroraOpacityVal\" class=\"value\">68%</span></div>\n", "")
          replace_once('js/config.js', "spaceWeatherScript.src='js/space-weather-v4.js?v=6';", "spaceWeatherScript.src='js/space-weather-v4.js?v=7';")

          replace_once('js/stations.js', "const OFFICIAL_TEMP_LABEL_MAX_OFFSET=95*60;\n", "const OFFICIAL_TEMP_LABEL_MAX_OFFSET=95*60;\nconst OFFICIAL_TEMP_LABEL_MAX_OFFSET_BY_COUNTRY=Object.freeze({NO:3*60*60});\n")
          replace_once('js/stations.js', "    const age=unix-station.time;\n    if(age>OFFICIAL_TEMP_LABEL_MAX_OFFSET || age<-OFFICIAL_TEMP_FUTURE_TOLERANCE_SEC) continue;\n\n    const key=officialTempStationKey(station);\n    const current=selected.get(key);\n    const score=age>=0 ? age : OFFICIAL_TEMP_LABEL_MAX_OFFSET+Math.abs(age);\n", "    const age=unix-station.time;\n    const maxOffset=OFFICIAL_TEMP_LABEL_MAX_OFFSET_BY_COUNTRY[station.country]||OFFICIAL_TEMP_LABEL_MAX_OFFSET;\n    if(age>maxOffset || age<-OFFICIAL_TEMP_FUTURE_TOLERANCE_SEC) continue;\n\n    const key=officialTempStationKey(station);\n    const current=selected.get(key);\n    const score=age>=0 ? age : maxOffset+Math.abs(age);\n")
          replace_once('js/stations.js', "    const currentAge=unix-current.time;\n    const currentScore=Number.isFinite(current._playbackScore)\n      ? current._playbackScore\n      : (currentAge>=0?currentAge:OFFICIAL_TEMP_LABEL_MAX_OFFSET+Math.abs(currentAge));\n", "    const currentAge=unix-current.time;\n    const currentMaxOffset=OFFICIAL_TEMP_LABEL_MAX_OFFSET_BY_COUNTRY[current.country]||OFFICIAL_TEMP_LABEL_MAX_OFFSET;\n    const currentScore=Number.isFinite(current._playbackScore)\n      ? current._playbackScore\n      : (currentAge>=0?currentAge:currentMaxOffset+Math.abs(currentAge));\n")

          replace_once('index.html', 'js/config.js?v=8.84', 'js/config.js?v=8.85')
          replace_once('index.html', 'js/stations.js?v=8.71', 'js/stations.js?v=8.72')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check js/space-weather-v4.js
          node --check js/stations.js
          node --check js/config.js

      - name: Publish fixes
        run: bash scripts/publish_generated_data.sh 'Apply aurora opacity and Norway temperature fixes' js/space-weather-v4.js js/config.js js/stations.js index.html
