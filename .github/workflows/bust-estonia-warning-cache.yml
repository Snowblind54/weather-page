name: Force fresh Estonia warning geometry scripts
on:
  push:
    branches: [fix/estonia-warning-geometry-cache]
    paths:
      - .github/workflows/bust-estonia-warning-cache.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bump warning script cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          replacements = {
              '<title>Northern Weather Map v8.57</title>': '<title>Northern Weather Map v8.60</title>',
              'js/estonia-warning-data.js?v=8.51': 'js/estonia-warning-data.js?v=8.60',
              'js/warnings.js?v=8.51': 'js/warnings.js?v=8.60',
              'js/warning-filters.js?v=8.51.1': 'js/warning-filters.js?v=8.60',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Save cache-bust update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust Estonia warning geometry cache'
          git push origin HEAD:fix/estonia-warning-geometry-cache
