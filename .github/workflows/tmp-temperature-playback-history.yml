name: Temporary temperature playback history

on:
  push:
    branches:
      - fix/temperature-playback-history

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/temperature-playback-history
          fetch-depth: 0
      - name: Apply playback history patch
        run: |
          python3 scripts/tmp_temperature_playback_history.py
          sed -i 's#period/latest-day/data.json#period/latest-hour/data.json#' js/stations.js
      - name: Validate JavaScript syntax
        run: node --check js/stations.js
      - name: Validate timeline history implementation
        run: |
          grep -q "OFFICIAL_TEMP_HISTORY_SEC=3\*60\*60" js/stations.js
          grep -q "period/latest-hour/data.json" js/stations.js
          grep -q "officialTempStationKey" js/stations.js
          grep -q "Choose one observation per station for the selected playback frame" js/stations.js
          grep -q "Northern Weather Map v8.70" index.html
          grep -q "js/stations.js?v=8.70" index.html
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/stations.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix temperature station playback history"
            git push origin HEAD:fix/temperature-playback-history
          fi
