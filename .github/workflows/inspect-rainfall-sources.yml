name: Inspect official rainfall formats
on:
  push:
    paths: [scripts/inspect_rainfall_sources.py, .github/workflows/inspect-rainfall-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_rainfall_sources.py
