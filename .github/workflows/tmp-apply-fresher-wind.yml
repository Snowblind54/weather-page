name: Temporary apply fresher official wind
on:
  push:
    branches: [feature/fresher-official-wind]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply fresher official wind update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fresher-official-wind
          fetch-depth: 0
      - name: Patch wind updater and UI metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(s.replace(old,new))
          patch('.github/workflows/update-official-wind.yml', "- cron: '14,44 * * * *'", "- cron: '4,14,24,34,44,54 * * * *'")
          patch('scripts/update_official_wind.py', '"""30-minute shared snapshots of official Northern European station wind; never substitute models.', '"""10-minute shared snapshots of official Northern European station wind; never substitute models.')
          patch('scripts/update_official_wind.py', "period='10-minute mean wind and reported 10-minute gust maximum, sampled hourly.',", "period='10-minute mean wind and reported 10-minute gust maximum.',")
          patch('scripts/update_official_wind.py', 'end = now.replace(minute=0, second=0, microsecond=0)', 'end = now.replace(minute=(now.minute // 10) * 10, second=0, microsecond=0)')
          patch('scripts/update_official_wind.py', 'starttime=(end - dt.timedelta(hours=3)).isoformat(), endtime=end.isoformat(), timestep=60,', 'starttime=(end - dt.timedelta(hours=3)).isoformat(), endtime=end.isoformat(), timestep=10,')
          patch('scripts/update_official_wind.py', 'snapshot = dict(version=1, generatedAt=int(now.timestamp()), refreshMinutes=30, units=\'m/s\',', 'snapshot = dict(version=1, generatedAt=int(now.timestamp()), refreshMinutes=10, units=\'m/s\',')
          patch('js/official-wind.js', 'data.refreshMinutes!==30', 'data.refreshMinutes!==10')
          patch('js/official-wind.js', 'Updated every 30 minutes on this map.', 'Updated every 10 minutes on this map.')
          patch('js/official-wind.js', "+' labels in view · 30-minute updates'", "+' labels in view · 10-minute updates'")
          patch('index.html', '<title>Northern Weather Map v8.72</title>', '<title>Northern Weather Map v8.73</title>')
          patch('index.html', 'A shared snapshot is refreshed hourly and checked every 5 minutes while enabled.', 'A shared snapshot is refreshed every 10 minutes and checked every 5 minutes while enabled.')
          patch('index.html', 'Updated hourly; gusts are reported measurements, not a full-hour maximum.', 'Snapshot refreshed every 10 minutes; source observation cadence varies by country. Gusts are reported measurements, not model values.')
          patch('index.html', 'js/official-wind.js?v=8.72', 'js/official-wind.js?v=8.73')
          PY
          git diff --check
      - name: Run official wind tests
        run: python3 -m unittest discover -s tests -p test_official_wind.py -v
      - name: Live-check official wind providers
        run: |
          cp data/official-wind.json /tmp/official-wind-before.json
          python3 scripts/update_official_wind.py
          python3 - <<'PY'
          import json,time
          d=json.load(open('data/official-wind.json'))
          assert d['refreshMinutes']==10
          fi=[s for s in d['stations'] if s['country']=='FI' and s['rows']]
          assert fi, 'No Finnish stations'
          minute_offsets={time.gmtime(r[0]).tm_min for s in fi for r in s['rows'][-12:]}
          assert any(m not in (0,) for m in minute_offsets), f'FMI did not return sub-hourly rows: {minute_offsets}'
          print('FMI recent minute offsets:', sorted(minute_offsets))
          for c in ['FI','SE','NO','LT']:
              src=d['sources'].get(c,{}); print(c,src.get('status'),src.get('fetchedAt'))
              assert src.get('status')=='ok', f'{c} feed failed live validation'
          PY
          mv /tmp/official-wind-before.json data/official-wind.json
      - name: Remove temporary diagnostics and commit production files
        run: |
          rm -f .github/workflows/tmp-wind-resolution-probe.yml .github/workflows/tmp-wind-resolution-probe2.yml .github/workflows/tmp-apply-fresher-wind.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/update-official-wind.yml scripts/update_official_wind.py js/official-wind.js index.html
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'Use fresher official wind observations'
          git push origin HEAD:feature/fresher-official-wind
