name: Maintain GitHub weather fallback
on:
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/github_fallback.py
      - .github/workflows/update-github-fallback.yml
permissions:
  contents: write
concurrency:
  group: github-weather-fallback
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - uses: actions/cache@v4
        with:
          path: data
          key: github-fallback-input-${{ github.run_id }}
          restore-keys: github-fallback-input-
      - run: python3 -m unittest discover -s tests -p test_github_fallback.py -v
      - name: Publish a complete fallback snapshot independently of R2
        run: python3 scripts/github_fallback.py backup
