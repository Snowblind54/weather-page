name: Check Western European observation formats
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/check-western-temperature.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install netCDF4==1.7.2
      - name: Inspect official provider formats
        run: |
          python3 - <<'PY'
          import urllib.request as r, urllib.parse as p, json, re, io, zipfile
          def get(url, headers=None):
              with r.urlopen(r.Request(url,headers={'User-Agent':'NorthernWeather (github.com/Snowblind54/weather-page)',**(headers or {})}),timeout=40) as f:return f.read()
          base='https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/'
          for url in [base+'recent/zehn_min_tu_Beschreibung_Stationen.txt','https://opendata.meteo.be/service/aws/ows?'+p.urlencode({'service':'WFS','version':'2.0.0','request':'DescribeFeatureType','typeNames':'aws:aws_10min'}),'https://opendata.meteo.be/service/aws/ows?'+p.urlencode({'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':'aws:aws_station','count':2,'outputFormat':'application/json'}),'https://opendata.meteo.be/service/aws/ows?'+p.urlencode({'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':'aws:aws_10min','count':1,'sortBy':'timestamp D','outputFormat':'application/json'})]:
              try: print('FORMAT',url,get(url).decode('utf-8',errors='replace')[:7000],flush=True)
              except Exception as e:print('FAILED',url,str(e),flush=True)
          try:
              listing=get(base+'now/').decode()
              name=re.findall(r'href="(10minutenwerte_TU_[0-9]+_now.zip)"',listing)[0]
              z=zipfile.ZipFile(io.BytesIO(get(base+'now/'+name)))
              print('DWD ZIP',name,z.namelist(),z.read(z.namelist()[0]).decode()[:1000],flush=True)
          except Exception as e:print('DWD ZIP ERROR',str(e),flush=True)
          import datetime as dt
          now=dt.datetime.now(dt.timezone.utc)
          day=(now-dt.timedelta(days=1)).strftime('%Y%m%d')
          for url in ['https://www.knmi.nl/nederland-nu/weer/waarnemingen/','https://www.daggegevens.knmi.nl/klimatologie/uurgegevens?'+p.urlencode({'start':day+'01','end':day+'24','vars':'T','stns':'ALL'})]:
              try:
                  raw=get(url).decode('utf-8',errors='replace')
                  if '<html' in raw.lower():
                      print('KNMI HTML',re.findall(r'<table.*?</table>',raw,re.S)[:1],flush=True)
                      print('KNMI TIME',re.findall(r'.{0,60}Waarnemingen.{0,150}',raw),flush=True)
                  else:print('KNMI METADATA',raw[:18000],flush=True)
              except Exception as e:print('KNMI PUBLIC ERROR',str(e),flush=True)
          PY
