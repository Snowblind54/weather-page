name: Deploy northern Meteosat sensitivity update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bump-cloud-north-sensitivity.yml
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cloud worker and page cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/clouds.js')
          t=p.read_text(encoding='utf-8')
          old="new Worker('js/cloud-worker.js?v=8.19')"
          new="new Worker('js/cloud-worker.js?v=8.20')"
          assert old in t
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='<script src="js/clouds.js?v=8.30"></script>'
          new='<script src="js/clouds.js?v=8.31"></script>'
          assert old in t
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate cloud scripts
        run: |
          node --check js/cloud-eumet-cleanup.js
          node --check js/cloud-worker.js
          node --check js/clouds.js
          grep -q "cloud-worker.js?v=8.20" js/clouds.js
          grep -q 'js/clouds.js?v=8.31' index.html
      - name: Publish cache bump
        run: bash scripts/publish_generated_data.sh 'Refresh northern Meteosat cloud extraction' js/clouds.js index.html
