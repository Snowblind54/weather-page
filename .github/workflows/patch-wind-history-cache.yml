name: Patch wind history cache key

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-wind-history-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch deployed wind asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('<title>Northern Weather Map v8.119</title>', '<title>Northern Weather Map v8.126</title>'),
                  ('js/official-wind.js?v=8.119', 'js/official-wind.js?v=8.126'),
              ],
              'js/official-wind.js': [
                  ("'v8.125'", "'v8.126'"),
              ],
              'js/auto-refresh.js': [
                  ("'v8.125'", "'v8.126'"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
              print(filename, 'patched', text != original)
          PY
      - name: Commit cache-bust
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/official-wind.js js/auto-refresh.js
          git commit -m 'Force-load fixed 24h wind history'
          git push origin main
