name: Refresh temperatures after Estonia fix
on: [push]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch official temperature observations
        run: python3 scripts/update_official_temperature_all.py
      - name: Validate snapshot
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('data/official-temperature.json',encoding='utf-8'))
          assert p['version']==1
          assert p['stations']
          assert p['sources'].get('EE',{}).get('count',0)>0
          ee=[s for s in p['stations'] if s.get('country')=='EE']
          assert ee
          print('Estonia stations',len(ee),'history rows',max(len(s.get('rows',[])) for s in ee))
          PY
      - name: Publish refreshed snapshot
        run: bash scripts/publish_generated_data.sh 'Refresh temperatures after Estonia timeline fix' data/official-temperature.json
