name: Fix cloud opacity and Estonia temperatures
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: echo '' | base64 -d | python3
      - name: Validate
        run: |
          python3 -m py_compile scripts/update_official_temperature.py
          node --check js/stations.js
          grep -q 'value="100"' index.html
          grep -q 'cloudOpacityVal" class="value">100%' index.html
          grep -q 'js/stations.js?v=8.73' index.html
          grep -q 'merge_country_history' scripts/update_official_temperature.py
          grep -q 'latestSelection' js/stations.js
      - name: Publish
        run: bash scripts/publish_generated_data.sh 'Fix cloud opacity and official temperature timeline' index.html js/stations.js scripts/update_official_temperature.py
