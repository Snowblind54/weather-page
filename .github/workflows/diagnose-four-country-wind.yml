name: Diagnose four-country wind sources
on:
  push:
    branches: [feature/wind-lv-lt-pl-dk]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe wind parameter coverage
        run: |
          python3 - <<'PY'
          import datetime as dt, json, urllib.parse, urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NorthernWeather diagnostics (github.com/Snowblind54/weather-page)'})
              with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
          now=dt.datetime.now(dt.timezone.utc)
          # Lithuania: count stations with current measured wind/gust.
          lt=get('https://api.meteo.lt/v1/stations'); good=[]
          for s in lt:
              try:o=get(f"https://api.meteo.lt/v1/stations/{s['code']}/observations/latest")
              except Exception:continue
              rows=[r for r in o.get('observations',[]) if r.get('windSpeed') is not None or r.get('windGust') is not None]
              if rows: good.append((s['code'],rows[-1]))
          print('LT wind stations',len(good),'samples',good[:5])
          # Poland: current usable wind and gust timestamps.
          pl=get('https://danepubliczne.imgw.pl/api/data/meteo'); mean=[];gust=[]
          for s in pl:
              if s.get('wiatr_srednia_predkosc') is not None:mean.append((s.get('kod_stacji'),s.get('nazwa_stacji'),s.get('wiatr_srednia_predkosc'),s.get('wiatr_srednia_predkosc_data')))
              if s.get('wiatr_poryw_10min') is not None:gust.append((s.get('kod_stacji'),s.get('nazwa_stacji'),s.get('wiatr_poryw_10min'),s.get('wiatr_poryw_10min_data')))
          print('PL mean count',len(mean),'latest samples',mean[:10]);print('PL gust count',len(gust),'samples',gust[:20])
          # Latvia parameter dictionary and current wind-like rows.
          api='https://data.gov.lv/dati/api/3/action/'
          params='38b462ac-08b9-4168-9d6e-cbaedc2e775d'; operational='17460efb-ae99-4d1d-8144-1068f184b05f'
          q=urllib.parse.urlencode({'resource_id':params,'limit':100,'q':'wind'})
          p=get(api+'datastore_search?'+q)['result']['records'];print('LV wind params',p)
          for rec in p:
              ab=rec['ABBREVIATION'];q=urllib.parse.urlencode({'resource_id':operational,'limit':50,'sort':'DATETIME desc','filters':json.dumps({'ABBREVIATION':ab})})
              rows=get(api+'datastore_search?'+q)['result']['records'];print('LV',ab,'count returned',len(rows),'samples',rows[:8])
          PY
