name: Diagnose four-country wind sources
on:
  push:
    branches: [feature/wind-lv-lt-pl-dk]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe Latvian wind parameter codes
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NorthernWeather diagnostics (github.com/Snowblind54/weather-page)'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          api='https://data.gov.lv/dati/api/3/action/'
          params='38b462ac-08b9-4168-9d6e-cbaedc2e775d'; operational='17460efb-ae99-4d1d-8144-1068f184b05f'
          p=get(api+'datastore_search?'+urllib.parse.urlencode({'resource_id':params,'limit':100}))['result']['records']
          wind=[r for r in p if 'wind' in (r.get('EN_DESCRIPTION') or '').lower()]
          print('LV wind params',wind)
          for rec in wind:
              ab=rec['ABBREVIATION']
              q=urllib.parse.urlencode({'resource_id':operational,'limit':12,'sort':'DATETIME desc','filters':json.dumps({'ABBREVIATION':ab})})
              rows=get(api+'datastore_search?'+q)['result']['records']
              print('LV',ab,rec.get('EN_DESCRIPTION'),rec.get('MEASUREMENT_UNIT'),'samples',rows)
          PY
