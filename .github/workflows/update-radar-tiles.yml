name: Prepare Nordic and Baltic radar tiles
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_radar_tiles.py
      - scripts/update_nordic_radar.py
      - scripts/requirements-radar-tiles.txt
      - tests/test_radar_tiles.py
      - .github/workflows/update-radar-tiles.yml
permissions:
  contents: read
concurrency:
  group: update-radar-tiles
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-radar-tiles.txt
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/radar-tiles.json
            data/radar-tiles
            data/nordic-radar-cache.json
            data/radar-cache
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/radar-tiles.json data/radar-tiles data/nordic-radar-cache.json data/radar-cache
      - run: pip install -r scripts/requirements-radar-tiles.txt
      - name: Check georeferencing, sparse tiles and failure retention
        run: python3 -m unittest discover -s tests -p test_radar_tiles.py -v
      - name: Prepare new observations and keep last successful frames
        run: python3 scripts/update_radar_tiles.py
      - name: Publish immutable tiles and archive measurements
        run: bash scripts/publish_generated_data.sh 'Refresh prepared Nordic and Baltic radar tiles' data/radar-tiles.json data/radar-tiles
