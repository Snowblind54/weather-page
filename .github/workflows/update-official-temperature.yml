name: Update official station temperatures
on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/southeast_temperature.py
      - scripts/southeast_temperature_stations.json
      - tests/test_southeast_temperature.py
      - tests/southeast-temperature.test.cjs
      - scripts/balkan_temperature.py
      - scripts/balkan_temperature_stations.json
      - tests/test_balkan_temperature.py
      - tests/balkan-temperature.test.cjs
      - scripts/moldova_belarus_temperature.py
      - scripts/moldova_temperature_stations.json
      - tests/test_moldova_belarus_temperature.py
      - tests/moldova-belarus-temperature.test.cjs
      - scripts/eastern_temperature.py
      - scripts/ukraine_temperature_stations.json
      - tests/test_eastern_temperature.py
      - tests/eastern-temperature.test.cjs
      - scripts/adriatic_observations.py
      - scripts/croatia_synop_stations.json
      - tests/test_adriatic_observations.py
      - tests/adriatic-observations.test.cjs
      - scripts/italy_hungary_observations.py
      - scripts/italy_airport_stations.json
      - tests/test_italy_hungary_observations.py
      - tests/italy-hungary-observations.test.cjs
      - scripts/alpine_observations.py
      - tests/test_alpine_observations.py
      - tests/alpine-observations.test.cjs
      - scripts/iberia_observations.py
      - scripts/spain_airport_stations.json
      - tests/fixtures/spain-airport-metars.json
      - tests/fixtures/aemet-hourly.json
      - tests/fixtures/ipma-stations.json
      - tests/fixtures/ipma-observations.json
      - tests/test_iberia_observations.py
      - tests/iberia-observations.test.cjs
      - scripts/meteofrance_observations.py
      - tests/test_meteofrance_observations.py
      - tests/fixtures/meteofrance-6m.geojson
      - scripts/andorra_observations.py
      - scripts/andorra_stations.json
      - tests/test_france_andorra.py
      - tests/france-andorra-temperature.test.cjs
      - scripts/latvia_observations.py
      - scripts/europe_synop.py
      - scripts/europe_synop_stations.json
      - tests/test_europe_synop.py
      - scripts/update_official_temperature.py
      - scripts/update_official_temperature_all.py
      - scripts/update_north_america_temperature.py
      - scripts/update_us_temperature.py
      - scripts/update_atlantic_temperature.py
      - scripts/update_western_temperature.py
      - scripts/update_central_temperature.py
      - tests/test_central_temperature.py
      - scripts/split_official_temperature.py
      - tests/test_temperature_split.py
      - tests/test_western_temperature.py
      - tests/test_atlantic_temperature.py
      - scripts/publish_generated_data.sh
      - js/stations.js
      - .github/workflows/update-official-temperature.yml
permissions:
  contents: write
concurrency:
  group: update-official-temperature
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  CLOUDFLARE_R2_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_R2_ANALYTICS_TOKEN }}
  R2_BILLING_DAY: ${{ vars.R2_BILLING_DAY }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Check Italian and Hungarian observations
        run: |
          python3 -m unittest discover -s tests -p test_italy_hungary_observations.py -v
          node --test tests/italy-hungary-observations.test.cjs
      - name: Check official Alpine observations
        run: |
          python3 -m unittest discover -s tests -p test_alpine_observations.py -v
          node --test tests/alpine-observations.test.cjs
      - name: Check official Iberian observations
        run: |
          python3 -m unittest discover -s tests -p test_iberia_observations.py -v
          node --test tests/iberia-observations.test.cjs
      - name: Check national Meteo-France observation adapter
        run: python3 -m unittest discover -s tests -p 'test_meteofrance_observations.py' -v
      - name: Check French and Andorran observations
        run: |
          python3 -m unittest discover -s tests -p 'test_france_andorra.py' -v
          node --test tests/france-andorra-temperature.test.cjs
      - name: Check shared official SYNOP observations
        run: python3 -m unittest discover -s tests -p 'test_europe_synop.py' -v
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/meteofrance-stations.csv
            data/official-temperature.json
            data/official-temperature-history.json
            data/noaa-temperature-stations.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Verify scan-free storage publication safeguards
        run: python3 -m unittest discover -s tests -p test_r2_storage.py -q
      - name: Restore verified last successful R2 data
        run: |
          python3 scripts/hydrate_r2_data.py data/official-temperature.json data/official-temperature-history.json
          python3 scripts/split_official_temperature.py --restore
      - name: Check temperature snapshot splitting and lazy loading
        run: |
          python3 -m unittest discover -s tests -p test_temperature_split.py -q
          node --test tests/temperature-performance.test.cjs
      - name: Check Atlantic station parsers
        run: python3 -m unittest discover -s tests -p test_atlantic_temperature.py -q
      - name: Check Western European station parsers
        run: python3 -m unittest discover -s tests -p test_western_temperature.py -q
      - name: Check Central European station parsers and map coverage
        run: |
          python3 -m unittest discover -s tests -p test_central_temperature.py -q
          node --test tests/central-temperature.test.cjs
      - name: Check Western European readings, shading and extremes
        run: node --test tests/western-temperature.test.cjs tests/temperature-us.test.cjs tests/weather-extremes.test.cjs
      - name: Check Croatian and Slovenian observations
        run: |
          python3 -m unittest discover -s tests -p test_adriatic_observations.py -v
          node --test tests/adriatic-observations.test.cjs
      - name: Check Ukrainian and Romanian official temperatures
        run: |
          python3 -m unittest discover -s tests -p test_eastern_temperature.py -v
          node --test tests/eastern-temperature.test.cjs
      - name: Check Moldovan and Belarusian official temperatures
        run: |
          python3 -m unittest discover -s tests -p test_moldova_belarus_temperature.py -v
          node --test tests/moldova-belarus-temperature.test.cjs
      - name: Check Bosnian and Serbian official temperatures
        run: |
          python3 -m unittest discover -s tests -p test_balkan_temperature.py -v
          node --test tests/balkan-temperature.test.cjs
      - name: Check southeastern Balkan official temperatures
        run: |
          python3 -m unittest discover -s tests -p test_southeast_temperature.py -v
          node --test tests/southeast-temperature.test.cjs
      - name: Fetch official temperature observations
        run: python3 scripts/update_official_temperature_all.py
      - name: Validate snapshot
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('data/official-temperature.json',encoding='utf-8'))
          assert p['version']==1
          assert p['refreshMinutes']==10
          assert p['historyHours']==24
          assert p['stations']
          assert 'LV' in p['sources'], 'Latvia source missing from temperature snapshot'
          assert 'US' in p['sources'], 'NOAA USA source missing from temperature snapshot'
          assert all(code in p['sources'] for code in ('FO','GB','IE')), 'Atlantic sources missing'
          assert all(code in p['sources'] for code in ('DE','NL','BE')), 'Western European sources missing'
          assert all(code in p['sources'] for code in ('CZ','SK','LU')), 'Central European sources missing'
          for s in p['stations']:
              assert s['rows']
              assert -90 < s['rows'][-1][1] < 55
          print('stations',len(p['stations']),p['sources'])
          PY
      - name: Separate map playback from full station history
        run: python3 scripts/split_official_temperature.py
      - name: Save official temperature snapshots
        run: bash scripts/publish_generated_data.sh 'Refresh official station temperature observations' data/official-temperature.json data/official-temperature-history.json


