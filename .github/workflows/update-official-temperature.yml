name: Update official Northern Europe temperature
on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_official_temperature.py
      - scripts/update_official_temperature_all.py
      - scripts/update_north_america_temperature.py
      - scripts/publish_generated_data.sh
      - js/stations.js
      - .github/workflows/update-official-temperature.yml
permissions:
  contents: write
concurrency:
  group: update-official-temperature
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  R2_PAUSED: ${{ vars.R2_PAUSED }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.50
      - name: Restore cached updater inputs
        uses: actions/cache@v4
        with:
          path: |
            data/official-temperature.json
          key: r2-input-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-input-${{ github.workflow }}-
      - name: Verify scan-free storage publication safeguards
        run: python3 -m unittest discover -s tests -p test_r2_storage.py -q
      - name: Restore verified last successful R2 data
        run: python3 scripts/hydrate_r2_data.py data/official-temperature.json
      - name: Fetch official temperature observations
        run: python3 scripts/update_official_temperature_all.py
      - name: Validate snapshot
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('data/official-temperature.json',encoding='utf-8'))
          assert p['version']==1
          assert p['refreshMinutes']==10
          assert p['historyHours']==24
          assert p['stations']
          assert 'LV' in p['sources'], 'Latvia source missing from temperature snapshot'
          for s in p['stations']:
              assert s['rows']
              assert -90 < s['rows'][-1][1] < 55
          print('stations',len(p['stations']),p['sources'])
          PY
      - name: Save official temperature snapshot
        if: ${{ !cancelled() }}
        run: bash scripts/publish_generated_data.sh 'Refresh official Northern Europe temperature observations' data/official-temperature.json
