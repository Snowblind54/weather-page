name: Update official Northern Europe temperature
on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_official_temperature.py
      - scripts/update_official_temperature_all.py
      - scripts/publish_generated_data.sh
      - js/stations.js
      - .github/workflows/update-official-temperature.yml
permissions:
  contents: write
concurrency:
  group: update-official-temperature
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch official temperature observations
        run: python3 scripts/update_official_temperature_all.py
      - name: Validate snapshot
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('data/official-temperature.json',encoding='utf-8'))
          assert p['version']==1
          assert p['refreshMinutes']==10
          assert p['historyHours']==24
          assert p['stations']
          assert 'LV' in p['sources'], 'Latvia source missing from temperature snapshot'
          for s in p['stations']:
              assert s['rows']
              assert -70 < s['rows'][-1][1] < 55
          print('stations',len(p['stations']),p['sources'])
          PY
      - name: Save official temperature snapshot
        if: ${{ !cancelled() }}
        run: bash scripts/publish_generated_data.sh 'Refresh official Northern Europe temperature observations' data/official-temperature.json
